# 持续集成（设计 40.8.3）：每个 PR 与推送到 main 时运行，任一检查失败则不能合并。
# 【安全】CI 中不存放任何签名私钥或服务器凭证（设计 29.7、40.8.3）；只需要读取代码的权限。
#
# 尚未加入（随对应里程碑补上）：
#   OpenAPI 契约校验       TODO(A0): api/openapi.yaml 建立后加入（设计 19.0.1）
#   注释检查               TODO(A0): revive exported 规则 / eslint-plugin-jsdoc（设计 39.7）
#   flutter analyze / test TODO(C): 阶段 C 开始后加入
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一分支的新提交会取消仍在运行的旧检查，节省时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-web:
    name: Go + Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe 需要完整历史与标签，用于版本号（设计 40.3.2）

      # Go 版本取自 go.mod，用最低要求的版本测试，保证用户按文档安装的工具链能编译
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Node 版本须满足 web/package.json 的 engines（@vitejs/plugin-vue 6 要求 ≥ 20.19）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 Web 依赖
        run: npm ci
        working-directory: web

      # 先构建 Web：面板通过 go:embed 内嵌 web/dist，没有它 Go 代码无法编译
      - name: Web 类型检查与构建
        run: make web

      - name: go vet + vue-tsc
        run: make lint

      - name: go test
        run: make test

      # 交叉编译全部架构，只确认能构建，不发布（发布流程见设计 40.8.4）
      - name: 交叉编译（Agent 8 种架构 + 面板 amd64/arm64）
        run: make build-linux

      # 真实 Linux 采集器：与 /proc、statfs 对照，并输出每轮采集的耗时与内存分配（设计 4、4.2）
      - name: Agent 采集器（真实 Linux）
        run: |
          go test -v -run TestLinuxCollect ./internal/agent/collector
          go test -run '^$' -bench LinuxCollect -benchmem -benchtime 200x ./internal/agent/collector

      # 用真实采集器运行 Agent 60 秒：报告常驻内存与 CPU，超过设计 4.2 的目标时失败
      - name: Agent 资源占用（设计 4.2）
        run: scripts/agent-footprint.sh dist/vpsmon-agent-linux-amd64

      # 以 Type=notify + 短 WatchdogSec 运行：确认 Agent 报告就绪并按时喂看门狗（设计 43.5）
      - name: Agent systemd 存活检测（设计 43.5）
        run: scripts/agent-systemd-check.sh dist/vpsmon-agent-linux-amd64

      # MIPS（OpenWrt 路由器等）：qemu 用户态模拟运行两种字节序的构建，并在大端上运行采集器的单元测试（设计 27.5.4）。
      # 模拟下读到的是宿主机（小端）内核写出的 /proc，因此跳过真实采集的集成测试
      - name: MIPS 构建（qemu 模拟）
        run: |
          sudo apt-get install -y -qq qemu-user >/dev/null
          qemu-mips dist/vpsmon-agent-linux-mips version
          qemu-mipsel dist/vpsmon-agent-linux-mipsle version
          CGO_ENABLED=0 GOARCH=mips GOMIPS=softfloat go test -c -o /tmp/collector-mips.test ./internal/agent/collector
          qemu-mips /tmp/collector-mips.test -test.skip 'TestLinuxCollect|TestReadFileReusesBuffer|Benchmark'

      # Alpine（musl、BusyBox、OpenRC）容器中：真实采集器集成测试 + OpenRC 安装、运行、卸载（设计 28）
      - name: Alpine / OpenRC 兼容（设计 28）
        run: scripts/alpine-check.sh

      # 限制内存的容器（LXC / Docker 型小鸡）：采集到的总内存应为容器上限而不是宿主机内存（设计 4.5）
      - name: 容器内存口径（设计 4.5）
        run: |
          CGO_ENABLED=0 go test -c -o /tmp/collector.test ./internal/agent/collector
          docker run --rm --memory=256m -e VPSMON_EXPECT_MEM_LIMIT=268435456 -v /tmp/collector.test:/collector.test:ro \
            alpine:3.20 /collector.test -test.run TestLinuxCollect -test.v

  design-doc:
    name: 设计文档校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 只依赖 Python 3 标准库，使用 runner 自带的 python3（设计 40.9.3）
      - run: make check-design
      # OpenAPI 契约至少要能被严格的 YAML 解析器解析（runner 自带 Ruby / libyaml）；完整的契约校验见 TODO(A0)
      - run: ruby -ryaml -e 'YAML.load_file("api/openapi.yaml")'

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # runner 自带 shellcheck；检查所有脚本，包括安装脚本模板 agent.sh.in（POSIX sh，设计 27.5）
      - run: shellcheck scripts/*.sh
      - run: shellcheck -s sh scripts/agent.sh.in
      # OpenRC 服务脚本（设计 28）：变量由 openrc-run 读取，SC2034（未使用的变量）不适用
      - run: shellcheck -s sh -e SC2034 deploy/openrc/vpsmon-agent
