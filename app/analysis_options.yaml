analyzer:
  errors:
    # 3.47 之后的 Flutter 稳定版把 package:flutter/material.dart 标为弃用（改用 package:material_ui），
    # CI 安装最新稳定版，flutter analyze 因此失败；本地开发与发布仍用 3.47.6。
    # TODO(C): 本地升级 Flutter 后迁移到 material_ui，并删掉这一行，恢复弃用检查。
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
include: package:flutter_lints/flutter.yaml
