name: vpsmon_app
description: VPS Monitor — App-first client for your self-hosted vpsmon-server.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  cryptography: ^2.9.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # 本仓库内的 Android 原生部分：告警通知与桌面小组件（packages/vpsmon_native）
  vpsmon_native:
    path: packages/vpsmon_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
