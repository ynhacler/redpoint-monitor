# 面板接口契约（设计 19.0.1）：新增或修改接口时先改这里，再写实现。
# Web（TypeScript）与 App（Dart）的请求类型将由本文件生成（TODO(B)）；
# 服务端测试校验响应与契约一致（TODO(A0)）。
openapi: 3.1.0
info:
  title: RedPoint Monitor API
  version: 0.2.0
  description: |
    约定（设计 19.0.2）：JSON，字段 snake_case；时间为 Unix 秒；字节、字节/秒、百分比（0～100）。
    错误统一为 `{"error": {"code", "message", "request_id", "details"}}`，错误码见 ErrorCode（设计 43.4）。
    每个响应都带 `X-Request-ID`。
servers:
  - url: /api/v1

security:
  - session: []

tags:
  - name: auth
    description: Web 登录（设计 8.2、17.4、19.1）
  - name: agent
    description: Agent 上报与注册（设计 19.10、27.6）
  - name: servers
    description: 节点与安装（设计 19.5、19.11）
  - name: audit
    description: 登录日志与操作日志（设计 24.8）
  - name: alerts
    description: 告警（设计 16、19.9）
  - name: traffic
    description: 流量统计、校准与预测（设计 5、19.8、32）

paths:
  /auth/captcha:
    get:
      tags: [auth]
      summary: 获取登录滑动验证码（设计 17.4）
      description: 一次性、2 分钟有效；正确位置只在服务端。面板以 --no-login-captcha 启动时返回 404。与登录共用 IP 限流。
      security: []
      responses:
        '200':
          description: 验证码图片
          content:
            application/json:
              schema:
                type: object
                required: [id, background, piece, piece_y, width, height, piece_size]
                properties:
                  id: { type: string }
                  background: { type: string, description: 'data:image/png;base64,…（带缺口）' }
                  piece: { type: string, description: 拼图块 PNG }
                  piece_y: { type: integer }
                  width: { type: integer }
                  height: { type: integer }
                  piece_size: { type: integer }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [auth]
      summary: 用户名 + 密码登录，写入会话 Cookie
      description: 同一 IP 1 分钟内失败 5 次锁定 15 分钟（设计 17.4）。用户名不存在与密码错误返回相同结果。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                remember: { type: boolean, description: 为 true 时 Cookie 保存 7 天，否则为会话 Cookie }
                captcha_id: { type: string }
                captcha_x: { type: number, description: 拼图块左边缘位置，像素 }
                captcha_ms: { type: integer, description: 拖动用时，毫秒 }
      responses:
        '200':
          description: 已登录；响应头 Set-Cookie 写入 vpsmon_session（HttpOnly、SameSite=Strict，HTTPS 下 Secure）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me:
    get:
      tags: [auth]
      summary: 当前账号与 CSRF Token（页面刷新后恢复登录状态）
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录（删除当前会话）
      responses:
        '204': { description: 已退出 }
        '401': { $ref: '#/components/responses/Error' }
  /auth/password:
    post:
      tags: [auth]
      summary: 修改密码；成功后该账号其他会话全部失效（设计 17.4）
      description: 使用初始 / 重置密码登录时，除 /auth/* 以外的接口都返回 403 password_change_required，直到修改密码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12 }
      responses:
        '204': { description: 已修改 }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/reauth:
    post:
      tags: [auth]
      summary: 敏感操作前重新输入密码，10 分钟内有效（设计 17.4）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204': { description: 已验证 }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /agent/enroll:
    post:
      tags: [agent]
      summary: 用一次性注册码换取 Agent Token（设计 27.6.2）
      description: |
        无需 Token，凭注册码认证；按 IP 单独限流（每分钟 10 次，失败过多临时封禁，设计 27.6.5）。
        注册码不存在、已使用、已撤销、已过期统一返回 enroll_code_invalid，不区分原因。
        注册成功后 10 分钟内，同一 machine_id_hash 用同一注册码重试，视为幂等重试：签发新 Token 并吊销上一个（设计 27.6.4）。
        新 Agent 注册成功后，该节点之前的 Token 全部吊销（设计 27.8）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '200':
          description: 注册成功。agent_token 只在此返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403':
          description: 节点为严格核对模式且主机信息不一致（设计 27.6.3）；注册码保持可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /agent/report:
    post:
      tags: [agent]
      summary: Agent 定时上报（设计 6）
      description: 只按 Token 哈希确定节点，请求体中的节点标识不可信（设计 1.6.6）。请求体上限 64 KB。
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Report' }
      responses:
        '204': { description: 已接收 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }

  /agent/unregister:
    post:
      tags: [agent]
      summary: Agent 本地卸载时通知面板（设计 27.11）
      description: 吊销该节点全部 Agent Token，节点回到「待安装」；历史数据与流量统计保留。
      security:
        - agentToken: []
      responses:
        '204': { description: 已注销 }
        '401': { $ref: '#/components/responses/Error' }

  /alerts:
    get:
      tags: [alerts]
      summary: 告警事件，按时间倒序（设计 19.9）
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [active, resolved, all], default: active }, description: active 为正在告警（firing） }
        - { name: server_id, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 告警事件
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/AlertEvent' } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /alert-rules:
    get:
      tags: [alerts]
      summary: 全部告警规则（全局 / 分组 / 节点三层，设计 16.2）
      responses:
        '200':
          description: 规则
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [alerts]
      summary: 为分组或节点新增覆盖：以同 rule_key 的全局规则为基础，应用请求中的字段
      requestBody:
        required: true
        content:
            application/json:
              schema:
                type: object
                required: [rule_key, scope_type, scope_id]
                properties:
                  rule_key: { type: string }
                  scope_type: { type: string, enum: [group, server] }
                  scope_id: { type: string, description: 分组名或节点 ID }
                  threshold: { type: number }
                  recover_threshold: { type: number, description: 不高于触发阈值 }
                  duration_s: { type: integer, minimum: 0, maximum: 86400 }
                  recover_duration_s: { type: integer, minimum: 0, maximum: 86400 }
                  severity: { type: string, enum: [info, warning, critical] }
                  repeat_interval_s: { type: integer, minimum: 0, maximum: 604800 }
                  enabled: { type: boolean }
      responses:
        '201': { description: 新增的规则, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /alert-rules/{id}:
    put:
      tags: [alerts]
      summary: 修改规则；省略的字段保持不变；类型、rule_key、层级不可改
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      requestBody:
        required: true
        content:
            application/json:
              schema:
                type: object
                properties:
                  threshold: { type: number }
                  recover_threshold: { type: number, description: 不高于触发阈值 }
                  duration_s: { type: integer, minimum: 0, maximum: 86400 }
                  recover_duration_s: { type: integer, minimum: 0, maximum: 86400 }
                  severity: { type: string, enum: [info, warning, critical] }
                  repeat_interval_s: { type: integer, minimum: 0, maximum: 604800 }
                  enabled: { type: boolean }
      responses:
        '200': { description: 修改后的规则, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [alerts]
      summary: 删除分组 / 节点覆盖（回到上一层的设置）；默认规则不能删除（422），可以关闭
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /alert-rules/preview:
    post:
      tags: [alerts]
      summary: 预览“按当前数据，此规则会对几台节点触发”（设计 16.2）；只比较阈值，不含持续时间
      description: 请求同新增或修改（带 id 表示修改现有规则）；被下层覆盖或关闭的节点不计入
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: 预览结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  matching: { type: integer }
                  total: { type: integer, description: 由此规则决定的节点数 }
                  items: { type: array, items: { type: object, properties: { server_id: { type: integer }, name: { type: string }, value: { type: number }, detail: { type: string } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /audit-logs:
    get:
      tags: [audit]
      summary: 审计日志：登录日志与操作日志（设计 24.8），按时间倒序；只读，不提供修改或删除
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [login, operation] }, description: 'login：登录、退出、二次验证；operation：其他操作；省略为全部' }
        - { name: result, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的 next_cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 审计记录
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多 }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        ts: { type: integer }
                        actor_type: { type: string, enum: [admin, agent, cli, system] }
                        actor_id: { type: string, description: 管理员用户名（登录失败时为填写的用户名）或节点 ID }
                        action: { type: string, example: server.create }
                        target_type: { type: string }
                        target_id: { type: string }
                        target_name: { type: string, description: 对象为节点且仍存在时的名称 }
                        result: { type: string, enum: [success, failure] }
                        client_ip: { type: string }
                        user_agent: { type: string }
                        details: { type: object, description: 已脱敏（设计 24.7） }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers:
    get:
      tags: [servers]
      summary: 节点列表（实时状态取自内存）
      description: TODO(A0)：改为 {"items", "next_cursor"} 格式（设计 19.0.2）。
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServerView' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [servers]
      summary: 新建节点（状态：待安装），同时生成注册码（设计 19.11、27.2）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServerRequest' }
      responses:
        '201':
          description: 已创建。完整注册码只在此返回一次
          headers:
            Location: { schema: { type: string }, description: 新节点的路径 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollCodeView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      tags: [servers]
      summary: 单个节点（格式同列表中的一项）
      responses:
        '200':
          description: 节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [servers]
      summary: 修改节点信息（设计 19.5）
      description: 整体替换可编辑信息，字段同新建（enroll_ttl 忽略）；未提供的可选字段视为清空。不改变注册状态。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServerRequest' }
      responses:
        '200':
          description: 修改后的节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [servers]
      summary: 删除节点及其全部历史数据，不可恢复
      description: 该节点的 Agent Token 随之删除。敏感操作：需在 10 分钟内调用过 /auth/reauth，否则 403 reauth_required（设计 17.4）。
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/install-command:
    get:
      tags: [servers]
      summary: 查看安装命令与注册码状态
      description: 不返回已生成过的完整注册码，命令中只有脱敏提示；丢失后需重新生成（设计 19.11）。
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '200':
          description: 安装命令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollCodeView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/enroll-code:
    post:
      tags: [servers]
      summary: 重新生成注册码，旧码立即失效（设计 27.4）；对已注册节点即重新安装 / 更换主机（设计 27.8）
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                enroll_ttl: { $ref: '#/components/schemas/EnrollTTL' }
      responses:
        '200':
          description: 新注册码，完整值只在此返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollCodeView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [servers]
      summary: 撤销注册码
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '204': { description: 已撤销 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/metrics/history:
    get:
      tags: [servers]
      summary: 节点历史指标（设计 19.7）
      description: |
        按范围自动选择粒度（设计 21）：1h / 6h → 10 秒原始点；24h → 1 分钟；7d → 5 分钟；30d → 1 小时。
        平均值字段与原始点同名，*_max 为桶内最大值。
      parameters:
        - { $ref: '#/components/parameters/ServerID' }
        - name: range
          in: query
          schema: { type: string, enum: ['1h', '6h', '24h', '7d', '30d'], default: 1h }
      responses:
        '200':
          description: 历史曲线
          content:
            application/json:
              schema:
                type: object
                required: [range, resolution, items]
                properties:
                  range: { type: string }
                  resolution: { type: integer, description: 点的间隔，秒 }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MetricPoint' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/current:
    get:
      tags: [traffic]
      summary: 本计费周期流量、校准与预测（设计 19.8、5.7、32）；与节点中的 traffic 字段相同
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '200':
          description: 本周期流量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/daily:
    get:
      tags: [traffic]
      summary: 最近 N 天每日流量，按日期升序，无数据的日期补 0
      parameters:
        - { $ref: '#/components/parameters/ServerID' }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 400, default: 30 } }
      responses:
        '200':
          description: 每日流量
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        day: { type: string, format: date }
                        rx: { type: integer }
                        tx: { type: integer }
                        used: { type: integer, description: 按计费模式取值并乘以系数；不含校准 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/monthly:
    get:
      tags: [traffic]
      summary: 最近 N 个计费周期（含当前），最新在前；历史周期按当前的计费模式、系数与额度计算
      parameters:
        - { $ref: '#/components/parameters/ServerID' }
        - { name: cycles, in: query, schema: { type: integer, minimum: 1, maximum: 36, default: 12 } }
      responses:
        '200':
          description: 每个计费周期的流量
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cycle_start: { type: string, format: date }
                        cycle_end: { type: string, format: date, description: 下一周期开始日（不含） }
                        rx: { type: integer }
                        tx: { type: integer }
                        adjustment: { type: integer }
                        used: { type: integer }
                        limit: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/calibrate:
    post:
      tags: [traffic]
      summary: 手动校准本周期已用流量（设计 5.7）
      description: 偏差 = 填写值 − 当前统计值，只作用于当前周期；再次校准覆盖之前的偏差，不累加。
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [used_gb]
              properties:
                used_gb: { type: number, minimum: 0, description: 服务商面板显示的已用量，按节点的 traffic_unit 口径 }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 校准后的本周期流量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/adjustments:
    get:
      tags: [traffic]
      summary: 校准历史（最近 50 条，最新在前）
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '200':
          description: 校准记录
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        cycle_start: { type: string, format: date }
                        measured_bytes: { type: integer, description: 校准时的统计值（已乘系数） }
                        reported_bytes: { type: integer, description: 用户填写值 }
                        adjustment_bytes: { type: integer }
                        note: { type: string }
                        created_at: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vpsmon_session
      description: |
        Web 管理员会话 Cookie（设计 8.2、17.4）。修改类请求（非 GET / HEAD）还必须带 X-CSRF-Token 头，
        值来自登录或 /auth/me 响应中的 csrf_token，否则 403。
    agentToken:
      type: http
      scheme: bearer
      description: Agent Token（agt_…），只能为 Token 绑定的节点上报（设计 23.2）

  parameters:
    ServerID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Error:
      description: 统一错误响应（设计 43.4）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 请求过于频繁
      headers:
        Retry-After: { schema: { type: integer }, description: 建议等待的秒数 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ErrorCode:
      type: string
      description: 稳定的错误码，一经发布不再改名（设计 43.4）
      enum: [validation_failed, bad_request, unauthorized, token_revoked, forbidden, not_found, conflict,
             payload_too_large, enroll_code_invalid, rate_limited, quota_exceeded, unavailable, internal,
             password_change_required, reauth_required, captcha_failed]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 中文提示，可直接展示给用户 }
            request_id: { type: string, example: r_8f2c1a3b4d5e }
            details:
              type: array
              description: 字段级错误，仅 validation_failed 使用
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }

    Me:
      type: object
      required: [username, must_change_password, csrf_token]
      properties:
        username: { type: string }
        must_change_password: { type: boolean, description: 使用初始 / 重置密码登录，需先修改密码 }
        csrf_token: { type: string, description: 修改类请求放在 X-CSRF-Token 头中 }

    EnrollTTL:
      type: string
      enum: ['1h', '24h', '7d']
      default: 24h
      description: 注册码有效期（设计 27.2）

    EnrollRequest:
      type: object
      description: 未知字段会被忽略，保证新版 Agent 与旧面板兼容
      required: [enroll_code]
      properties:
        enroll_code: { type: string, pattern: '^ENR-[0-9A-Z]{4}(-[0-9A-Z]{4}){3}$', description: 大小写不敏感 }
        hostname: { type: string }
        machine_id_hash: { type: string, example: 'sha256:…', description: sha256(/etc/machine-id)，用于重试幂等与识别更换主机 }
        os: { type: string, example: ubuntu }
        os_version: { type: string, example: '24.04' }
        arch: { type: string, example: amd64 }
        agent_version: { type: string }

    EnrollResponse:
      type: object
      required: [server_id, server_name, agent_token, warnings]
      properties:
        server_id: { type: integer }
        server_name: { type: string }
        agent_token: { type: string, description: 'agt_…，写入 /etc/vpsmon-agent/token 后不再传输' }
        warnings:
          type: array
          items: { type: string }
          description: 主机名 / IP 与填写值不一致时的提示（设计 27.6.3）

    CreateServerRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        expected_hostname: { type: string, description: 注册时核对 }
        expected_ipv4: { type: string, format: ipv4 }
        expected_ipv6: { type: string, format: ipv6 }
        group: { type: string, maxLength: 32 }
        note: { type: string, maxLength: 500 }
        provider: { type: string, maxLength: 64 }
        plan: { type: string, maxLength: 64 }
        region: { type: string, maxLength: 64 }
        country: { type: string, pattern: '^[A-Za-z]{2}$', description: 'ISO 3166-1 两位代码（大小写不敏感，保存为大写）；用于显示国旗' }
        bandwidth_mbps: { type: integer, minimum: 0, maximum: 1000000, description: 服务商标称带宽（端口速率），Mbps；0 或省略表示未填（设计 27.2） }
        traffic_limit_gb: { type: number, minimum: 0, description: 按 traffic_unit 口径的 GB / GiB（设计 5.8），0 或省略表示不限 }
        traffic_unit: { type: string, enum: [decimal, binary], default: decimal, description: 'decimal：1 GB = 10^9 字节；binary：1 GiB = 2^30 字节（设计 5.8）' }
        traffic_factor: { type: number, minimum: 0.5, maximum: 2, default: 1, description: 统计系数，修正固定比例偏差（设计 5.7） }
        traffic_reset_day: { type: integer, minimum: 1, maximum: 31, default: 1 }
        traffic_count_mode: { type: string, enum: [sum, rx, tx, max], default: sum, description: 设计 1.2.4 }
        price: { type: number, minimum: 0, description: 续费价格，保留两位小数 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$', description: ISO 4217；填写价格时必填 }
        billing_period:
          type: string
          enum: ['', monthly, quarterly, semiannually, annually, biennially, triennially, one_time]
        expire_date: { type: string, format: date, description: YYYY-MM-DD }
        enroll_ttl: { $ref: '#/components/schemas/EnrollTTL' }
        verify_mode: { type: string, enum: [warn, strict], default: warn, description: 核对严格程度（设计 27.6.3） }

    InstallCommand:
      type: object
      required: [mode, command, server]
      properties:
        mode:
          type: string
          enum: [default, manual]
          description: 面板尚未同步并验签任何官方版本时只有 manual（设计 27.3.1）
        command: { type: string, description: '不使用管道执行（设计 27.3）' }
        server: { type: string, description: 写进命令的面板对外地址 }
        release:
          type: ['object', 'null']
          description: 已验签的官方版本；TODO(A7)

    EnrollCodeView:
      type: object
      required: [server_id, server_name, enroll_state, enroll_code_hint, enroll_status, enroll_expires_at, install]
      properties:
        server_id: { type: integer }
        server_name: { type: string }
        enroll_state: { type: string, enum: [pending, enrolled] }
        enroll_code: { type: string, description: 完整注册码，只在新建与重新生成时返回 }
        enroll_code_hint: { type: string, example: 'ENR-7KQ2-****' }
        enroll_status: { type: string, enum: [ACTIVE, USED, REVOKED, EXPIRED, NONE] }
        enroll_expires_at: { type: integer, description: Unix 秒 }
        install: { $ref: '#/components/schemas/InstallCommand' }

    ServerView:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [online, unknown, offline, pending], description: '≤30 秒在线，≤120 秒未知（设计 22）；pending 为待安装（设计 27.7）' }
        last_seen_at: { type: integer }
        enroll_state: { type: string, enum: [pending, enrolled] }
        expected_hostname: { type: string }
        expected_ipv4: { type: string }
        expected_ipv6: { type: string }
        verify_mode: { type: string }
        hostname: { type: string }
        ipv4: { type: string }
        ipv6: { type: string }
        enrolled_at: { type: integer }
        group: { type: string }
        note: { type: string }
        provider: { type: string }
        plan: { type: string }
        region: { type: string }
        country: { type: string, description: ISO 3166-1 两位代码（大写），空表示未填 }
        bandwidth_mbps: { type: integer, description: 标称带宽 Mbps，0 表示未填 }
        price_cents: { type: integer, description: 续费价格 × 100 }
        currency: { type: string }
        billing_period: { type: string }
        expire_date: { type: string }
        traffic_limit_bytes: { type: integer }
        traffic_reset_day: { type: integer }
        traffic_count_mode: { type: string }
        created_at: { type: integer }
        latest: { $ref: '#/components/schemas/Report' }
        traffic_unit: { type: string, enum: [decimal, binary] }
        traffic_factor: { type: number }
        traffic: { $ref: '#/components/schemas/TrafficView' }
        alerts:
          type: array
          description: 活动告警（firing），严重在前；同一类型只保留最严重的一条；节点离线时只有离线告警（设计 16.4）
          items:
            type: object
            properties:
              event_id: { type: integer }
              rule_key: { type: string }
              type: { type: string }
              severity: { type: string, enum: [info, warning, critical] }
              message: { type: string }
              value: { type: number, description: 当前值：百分比、离线秒数或负载倍数 }
              fired_at: { type: integer }

    AlertRule:
      type: object
      properties:
        id: { type: integer }
        rule_key: { type: string, description: 同一规则在三层中的标识，下层按它覆盖上层 }
        scope_type: { type: string, enum: [global, group, server] }
        scope_id: { type: string }
        type: { type: string, enum: [offline, cpu, memory, disk, swap, load, traffic, traffic_forecast] }
        operator: { type: string, enum: ['>', '>='] }
        threshold: { type: number }
        recover_threshold: { type: number, description: 低于此值恢复（回差） }
        duration_s: { type: integer }
        recover_duration_s: { type: integer }
        severity: { type: string, enum: [info, warning, critical] }
        repeat_interval_s: { type: integer }
        enabled: { type: boolean }

    AlertEvent:
      type: object
      properties:
        id: { type: integer }
        rule_id: { type: integer }
        rule_key: { type: string }
        server_id: { type: integer }
        server_name: { type: string }
        type: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        state: { type: string, enum: [firing, resolved] }
        value: { type: number, description: 触发时的值 }
        threshold: { type: number }
        message: { type: string }
        started_at: { type: integer, description: 开始满足条件（pending）的时间 }
        fired_at: { type: integer }
        resolved_at: { type: integer }
        resolved_value: { type: number }

    TrafficView:
      type: object
      description: 本计费周期流量（设计 5.7、5.8、32）。字节数均为整数，GB 换算由客户端按 unit 完成。
      properties:
        cycle_start: { type: string, format: date }
        cycle_end: { type: string, format: date, description: 下一周期开始日（不含） }
        rx: { type: integer }
        tx: { type: integer }
        measured: { type: integer, description: 统计值：按计费模式取值 × 系数，不含校准 }
        adjustment: { type: integer, description: 本周期最近一次校准的偏差，可为负 }
        calibrated_at: { type: integer, description: 最近一次校准时间，Unix 秒；未校准时省略 }
        used: { type: integer, description: 展示值 = 统计值 + 校准偏差 }
        limit: { type: integer, description: 字节，0 表示不限 }
        unit: { type: string, enum: [decimal, binary] }
        factor: { type: number }
        forecast:
          type: object
          description: 周期结束时的预计用量；周期开始不足 3 天时省略（设计 32）
          properties:
            daily: { type: integer, description: 采用的日均 }
            total: { type: integer }
            over: { type: boolean, description: 预计超过额度 }

    Report:
      type: object
      description: Agent 上报，定义见 internal/protocol（设计 6.2）；只做向后兼容的新增
      properties:
        timestamp: { type: integer }
        agent_version: { type: string }
        final: { type: boolean }
        system:
          type: object
          properties:
            hostname: { type: string }
            os: { type: string }
            os_version: { type: string }
            kernel: { type: string }
            arch: { type: string }
            uptime: { type: integer, description: 秒 }
            boot_id: { type: string }
            cpu_model: { type: string, description: 可选（设计 4.4） }
        cpu:
          type: object
          properties:
            usage: { type: number }
            cores: { type: integer }
            load1: { type: number }
            load5: { type: number }
            load15: { type: number }
            breakdown:
              type: object
              description: 可选：两次采样之间各类时间占比 0～100（设计 4.4）
              properties:
                user: { type: number }
                nice: { type: number }
                system: { type: number }
                iowait: { type: number }
                irq: { type: number }
                softirq: { type: number }
                steal: { type: number }
                idle: { type: number }
            per_core: { type: array, items: { type: number }, description: 可选；GET /servers 列表中省略 }
            temp_c: { type: number, description: 可选，CPU 温度 ℃ }
        memory:
          type: object
          properties:
            total: { type: integer }
            used: { type: integer, description: MemTotal − MemAvailable }
            available: { type: integer }
            usage: { type: number }
            free: { type: integer, description: 可选 }
            buffers: { type: integer, description: 可选 }
            cached: { type: integer, description: 可选：Cached + SReclaimable }
        swap: { type: object }
        processes:
          type: object
          description: 可选（设计 4.9）
          properties:
            total: { type: integer }
            running: { type: integer }
        conns:
          type: object
          description: 可选（设计 4.9）：sockstat 的 inuse，IPv4 + IPv6
          properties:
            tcp: { type: integer }
            udp: { type: integer }
            time_wait: { type: integer }
        disk:
          type: array
          description: 每个挂载点（设计 4.6）；只采集本地块设备文件系统，同一设备只报一次
          items:
            type: object
            properties:
              mount: { type: string }
              total: { type: integer }
              used: { type: integer }
              usage: { type: number, description: 与 df 的 Use% 一致 }
              fstype: { type: string }
              device: { type: string }
              available: { type: integer }
        network: { type: array, items: { type: object } }
        disk_io:
          type: array
          description: 可选，整块磁盘的 IO（设计 4.7）
          items:
            type: object
            properties:
              device: { type: string }
              read_bytes: { type: integer }
              write_bytes: { type: integer }
              read_ops: { type: integer }
              write_ops: { type: integer }
              io_time_ms: { type: integer }
              read_speed: { type: integer }
              write_speed: { type: integer }
              read_iops: { type: number, description: 可选 }
              write_iops: { type: number, description: 可选 }
              await_ms: { type: number, description: 可选：每次 IO 平均耗时 }
              util: { type: number, description: 可选：设备忙碌占比 0～100 }

    MetricPoint:
      type: object
      properties:
        ts: { type: integer, description: 桶起点，Unix 秒 }
        cpu: { type: number }
        cpu_max: { type: number }
        load1: { type: number }
        mem_used: { type: integer }
        mem_total: { type: integer }
        swap_used: { type: integer }
        disk_used: { type: integer }
        disk_total: { type: integer }
        rx_speed: { type: integer }
        rx_speed_max: { type: integer }
        tx_speed: { type: integer }
        tx_speed_max: { type: integer }
        disk_read: { type: ['integer', 'null'], description: 所有磁盘读速率之和，字节/秒；旧版 Agent 时段为 null（设计 4.7） }
        disk_read_max: { type: ['integer', 'null'] }
        disk_write: { type: ['integer', 'null'] }
        disk_write_max: { type: ['integer', 'null'] }
