# 面板接口契约（设计 19.0.1）：新增或修改接口时先改这里，再写实现。
# Web 的请求类型由本文件生成（make api-types → web/src/api.gen.ts，CI 检查一致）；App（Dart）随阶段 C；
# 服务端测试校验响应与契约一致：测试中每个 2xx JSON 响应都按本契约检查（internal/server/contract_test.go）。
openapi: 3.1.0
info:
  title: RedPoint Monitor API
  version: 0.2.0
  description: |
    约定（设计 19.0.2）：JSON，字段 snake_case；时间为 Unix 秒；字节、字节/秒、百分比（0～100）。
    错误统一为 `{"error": {"code", "message", "request_id", "details"}}`，错误码见 ErrorCode（设计 43.4）。
    每个响应都带 `X-Request-ID`。
servers:
  - url: /api/v1

security:
  - session: []

tags:
  - name: auth
    description: Web 登录（设计 8.2、17.4、19.1）
  - name: agent
    description: Agent 上报与注册（设计 19.10、27.6）
  - name: servers
    description: 节点与安装（设计 19.5、19.11）
  - name: audit
    description: 登录日志与操作日志（设计 24.8）
  - name: alerts
    description: 告警（设计 16、19.9）
  - name: traffic
    description: 流量统计、校准与预测（设计 5、19.8、32）
  - name: events
    description: 实时事件（WebSocket，设计 20）
  - name: subscriptions
    description: 订阅：个人订阅服务的费用、扣费日与提醒（设计 47）
  - name: cloud
    description: 云厂商账户：费用、流量与实例（设计 44）
  - name: app
    description: App 接入：AK、配对、设备凭证与设备管理（设计 8.4、12.3～12.7、19.2～19.4）
  - name: system
    description: 面板自身的设置：监听端口（设计 51）

paths:
  /auth/captcha:
    get:
      tags: [auth]
      summary: 获取登录滑动验证码（设计 17.4）
      description: 一次性、2 分钟有效；正确位置只在服务端。面板以 --no-login-captcha 启动时返回 404。与登录共用 IP 限流。
      security: []
      responses:
        '200':
          description: 验证码图片
          content:
            application/json:
              schema:
                type: object
                required: [id, background, piece, piece_y, width, height, piece_size]
                properties:
                  id: { type: string }
                  background: { type: string, description: 'data:image/png;base64,…（带缺口）' }
                  piece: { type: string, description: 拼图块 PNG }
                  piece_y: { type: integer }
                  width: { type: integer }
                  height: { type: integer }
                  piece_size: { type: integer }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [auth]
      summary: 用户名 + 密码登录，写入会话 Cookie
      description: 同一 IP 1 分钟内失败 5 次锁定 15 分钟（设计 17.4）。用户名不存在与密码错误返回相同结果。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                remember: { type: boolean, description: 为 true 时 Cookie 保存 7 天，否则为会话 Cookie }
                captcha_id: { type: string }
                captcha_x: { type: number, description: 拼图块左边缘位置，像素 }
                captcha_ms: { type: integer, description: 拖动用时，毫秒 }
      responses:
        '200':
          description: |
            已登录；响应头 Set-Cookie 写入 vpsmon_session（HttpOnly、SameSite=Strict，HTTPS 下 Secure）。
            账号开启两步验证时密码正确也不登录：返回 TotpChallenge，再用 POST /auth/login/totp 提交验证码（修订第 160 条）。
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Me' }
                  - { $ref: '#/components/schemas/TotpChallenge' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login/totp:
    post:
      tags: [auth]
      summary: 两步验证的第二步：提交验证码或恢复码，成功后写入会话 Cookie（修订第 160 条）
      description: |
        challenge 来自 POST /auth/login，5 分钟内有效、只能用一次，最多尝试 5 次；失败与登录共用同一 IP 的失败计数。
        code 为认证器 App 的 6 位数字（前后各容许 30 秒），或一次性的恢复码（xxxx-xxxx，用过即失效）。
        401 的错误码：unauthorized 为验证码不正确（可重试）；token_expired 为 challenge 已过期或次数用完，需重新输入密码。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string }
      responses:
        '200':
          description: 已登录（同 POST /auth/login）
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/totp/setup:
    post:
      tags: [auth]
      summary: 开始开启两步验证：生成新密钥（需重新验证密码；10 分钟内用 /auth/totp/enable 确认）
      responses:
        '200': { description: 新密钥, content: { application/json: { schema: { $ref: '#/components/schemas/TotpSetup' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /auth/totp/enable:
    post:
      tags: [auth]
      summary: 用认证器显示的验证码确认并开启两步验证，返回 10 个恢复码（只显示这一次；记入操作日志）
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200':
          description: 已开启
          content: { application/json: { schema: { type: object, required: [recovery_codes], properties: { recovery_codes: { type: array, items: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /auth/totp/disable:
    post:
      tags: [auth]
      summary: 关闭两步验证（需重新验证密码；记入操作日志）。忘记设备且没有恢复码时在面板主机执行 vpsmon-server admin disable-totp
      responses:
        '204': { description: 已关闭 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /users:
    get:
      tags: [auth]
      summary: Web 账号列表（管理员与查看者，修订第 161 条）
      responses:
        '200':
          description: 账号列表，管理员在前
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/UserView' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [auth]
      summary: 新建查看者账号（需重新验证密码；记入操作日志）。返回随机初始密码，只显示这一次，首次登录须修改
      description: 查看者只能访问读取类接口（节点、指标、流量、测速、告警列表，与只读 API Key 相同）与自己的账号设置；最多 20 个。
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [username], properties: { username: { type: string, description: '3～32 位字母、数字、点、下划线或连字符；不区分大小写' } } } } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/UserCreated' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /users/{id}:
    delete:
      tags: [auth]
      summary: 删除查看者账号（需重新验证密码；其登录立即失效；记入操作日志）。不能删除管理员
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /users/{id}/password:
    post:
      tags: [auth]
      summary: 重置查看者的密码（需重新验证密码；其登录全部退出；记入操作日志）。返回新的随机密码，只显示这一次
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: 新密码, content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [auth]
      summary: 当前账号与 CSRF Token（页面刷新后恢复登录状态）
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录（删除当前会话）
      responses:
        '204': { description: 已退出 }
        '401': { $ref: '#/components/responses/Error' }
  /auth/password:
    post:
      tags: [auth]
      summary: 修改密码；成功后该账号其他会话全部失效（设计 17.4）
      description: 使用初始 / 重置密码登录时，除 /auth/* 以外的接口都返回 403 password_change_required，直到修改密码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '204': { description: 已修改 }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/reauth:
    post:
      tags: [auth]
      summary: 敏感操作前重新输入密码，10 分钟内有效（设计 17.4）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204': { description: 已验证 }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /auth/sessions:
    get:
      tags: [auth]
      summary: 当前账号的登录会话（设计 24.8、17.4），最近活动在前
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多（此列表不分页，恒为空） }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, created_at, last_seen_at, expires_at, client_ip, user_agent, current]
                      properties:
                        id: { type: integer }
                        created_at: { type: integer }
                        last_seen_at: { type: integer }
                        expires_at: { type: integer }
                        client_ip: { type: string }
                        user_agent: { type: string }
                        current: { type: boolean, description: 是否为发出本次请求的会话 }
        '401': { $ref: '#/components/responses/Error' }

  /auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: 踢出一个会话（该浏览器需要重新登录）；只能操作当前账号的会话，记入审计日志
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: 已踢出 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /version:
    get:
      tags: [auth]
      summary: 面板版本（Web 会话或 API Key）
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      responses:
        '200':
          description: 版本
          content:
            application/json:
              schema: { type: object, required: [version], properties: { version: { type: string } } }
        '401': { $ref: '#/components/responses/Error' }

  /api-keys:
    get:
      tags: [auth]
      summary: 只读 API Key 列表（设计 45.2）；不含完整 Key
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                type: object
                required: [next_cursor, items]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多 }
                  items: { type: array, items: { $ref: '#/components/schemas/APIKey' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [auth]
      summary: 创建只读 API Key（需在 10 分钟内重新验证过密码）；完整 Key 只在响应中出现这一次
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/APIKeyInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [key, api_key]
                properties:
                  key: { type: string, description: 'api_…，只显示这一次' }
                  api_key: { $ref: '#/components/schemas/APIKey' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api-keys/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    delete:
      tags: [auth]
      summary: 吊销 API Key（立即生效，记录保留）
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /app-access-keys:
    get:
      tags: [app]
      summary: App 配对 AK 列表（设计 8.4.2）；不含完整 AK
      responses:
        '200':
          description: 列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/AppAccessKey' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [app]
      summary: 创建 App 配对 AK（需在 10 分钟内重新验证过密码）；完整 AK 与配对链接只在响应中出现这一次（设计 8.4.1、19.2）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppAccessKeyInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [access_key, pair_url, server_url, app_access_key]
                properties:
                  access_key: { type: string, description: 'MNT-…，只显示这一次' }
                  server_url: { type: string, description: 面板对外地址（--public-url，或由请求推断） }
                  pair_url: { type: string, description: '二维码内容：monitor://pair?server=…&ak=…（设计 12.4）' }
                  app_access_key: { $ref: '#/components/schemas/AppAccessKey' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /app-access-keys/{id}/revoke:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [app]
      summary: 吊销 AK（之后不能再配对）；可选同时吊销用它配对的设备（设计 12.7）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revoke_devices: { type: boolean, description: 同时吊销用此 AK 配对的全部设备 }
      responses:
        '200':
          description: 已吊销
          content: { application/json: { schema: { type: object, required: [revoked_devices], properties: { revoked_devices: { type: integer } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /app-devices:
    get:
      tags: [app]
      summary: 已连接的 App 设备（设计 8.4.3），有效的在前
      responses:
        '200':
          description: 列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/AppDevice' } } } } } }
        '401': { $ref: '#/components/responses/Error' }

  /app-devices/{id}/revoke:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [app]
      summary: 吊销设备：Access Token、Refresh Token、WebSocket 连接与 Push 公钥立即失效（设计 19.4）
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /app/pair:
    post:
      tags: [app]
      summary: 用 AK 配对，签发设备凭证（设计 12.3、19.3）
      security: []
      description: |
        无需登录，凭 AK 认证；按 IP 限流（每分钟 10 次，失败过多临时封禁）。AK 不存在、已用完、已吊销、已过期
        统一返回 access_key_invalid，不区分原因。Access Token 30 分钟有效，Refresh Token 90 天有效、每次刷新轮换。
        App 应把两个 Token 保存在系统安全存储中（设计 12.6）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_key, device]
              properties:
                access_key: { type: string, description: 'MNT-…（大小写、空格不敏感）' }
                device:
                  type: object
                  required: [name, platform]
                  properties:
                    name: { type: string, maxLength: 64 }
                    platform: { type: string, enum: [ios, android] }
                    app_version: { type: string, maxLength: 32 }
                push_public_key: { type: string, description: 'X25519 公钥（32 字节，标准 Base64），用于端到端加密推送（设计 12.3、30.3）；可省略' }
      responses:
        '200': { description: 已配对, content: { application/json: { schema: { $ref: '#/components/schemas/AppTokens' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /app/token/refresh:
    post:
      tags: [app]
      summary: 用 Refresh Token 换取新的 Access Token 与 Refresh Token（轮换，设计 12.5）
      security: []
      description: |
        旧 Refresh Token 立即失效。同一个旧 Refresh Token 在轮换后 60 秒内再次使用（上次响应丢失）时重新签发；
        超过 60 秒后再次使用视为凭证泄露，设备被吊销（token_revoked）。设备已吊销或 90 天未刷新时返回 token_revoked，
        App 应清除本地凭证并回到配对页（设计 12.7）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, description: 'rt_…' }
                app_version: { type: string, maxLength: 32, description: 可选：更新设备记录中的 App 版本 }
      responses:
        '200': { description: 新凭证, content: { application/json: { schema: { $ref: '#/components/schemas/AppTokens' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /app/me:
    get:
      tags: [app]
      summary: 当前设备与授权范围
      security: [{ deviceToken: [] }]
      responses:
        '200': { description: 设备, content: { application/json: { schema: { $ref: '#/components/schemas/AppMe' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /app/cloud:
    get:
      tags: [app]
      summary: 云账户与实例的只读摘要（设计 44.8）
      security: [{ deviceToken: [] }]
      description: |
        App 的“云账户”页：账户的同步状态、本月费用与实例列表。只返回展示需要的字段，不含任何凭证信息（包括凭证提示）、
        公网 IP 与云厂商实例 ID。云账户覆盖整个面板，只有授权范围为“全部节点”的设备能看到；其他范围的设备得到 limited 为 true、
        列表为空。App 只读：添加、修改、同步都在 Web 中进行。
      responses:
        '200': { description: 摘要, content: { application/json: { schema: { $ref: '#/components/schemas/AppCloud' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /app/subscriptions:
    get:
      tags: [app]
      summary: 订阅的只读列表（设计 47，修订第 213 条）
      security: [{ deviceToken: [] }]
      description: |
        App 的“订阅”页：与 Web 相同的订阅列表（含计算得到的下次扣费日），按下次扣费日排序。订阅属于整个面板，
        只有授权范围为“全部节点”的设备能看到；其他范围的设备得到 limited 为 true、列表为空。App 只读：添加、修改都在 Web 中进行。
      responses:
        '200': { description: 订阅列表, content: { application/json: { schema: { $ref: '#/components/schemas/AppSubscriptions' } } } }
        '401': { $ref: '#/components/responses/Error' }

    post:
      tags: [app]
      summary: 新增一条订阅（修订第 217 条）
      security: [{ deviceToken: [] }]
      description: |
        约束 5（App 只读）的唯一写入例外：只有 AK 勾选了“允许记录订阅”且授权范围为“全部节点”的设备可以新增（以及修改、删除，
        修订第 218 条），其他返回 403。请求体与 Web 的 POST /subscriptions 相同；不能上传图标。写入审计日志，操作者为设备名。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionInput' } } }
      responses:
        '201': { description: 已新增, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /app/subscriptions/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [app]
      summary: 修改一条订阅（修订第 218 条）
      security: [{ deviceToken: [] }]
      description: 与 POST /app/subscriptions 相同的权限（AK 允许记录订阅且授权全部节点）；整体替换，请求体与 Web 的 PUT /subscriptions/{id} 相同。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionInput' } } }
      responses:
        '200': { description: 已修改, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [app]
      summary: 删除一条订阅（修订第 218 条）
      security: [{ deviceToken: [] }]
      description: 与 POST /app/subscriptions 相同的权限；记审计日志。
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /app/subscriptions/{id}/renew:
    post:
      tags: [app]
      summary: 已续费：订阅结束日期顺延一个订阅周期（修订第 224 条）
      security: [{ deviceToken: [] }]
      description: 只适用于填写了结束日期的订阅（手动续费的 VPS、域名等），从原结束日期按订阅周期顺延；没有结束日期或一次性付费时返回 409。App 设备：AK 允许记录订阅且授权全部节点（accessAppSubs，约束 5 的唯一写入例外）；记审计日志。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: 续费后的订阅, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /app/servers/{id}/renew:
    post:
      tags: [app]
      summary: 已续费：节点到期日顺延一个计费周期（修订第 224 条）
      security: [{ deviceToken: [] }]
      description: 从原来的到期日算起（不是今天）按计费周期（月 / 季 / 半年 / 年 / 两年 / 三年付）顺延；没有到期日或一次性付费时返回 409。App 设备：AK 允许记录订阅且授权全部节点（accessAppSubs，约束 5 的唯一写入例外）；记审计日志。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: 新的到期日
          content: { application/json: { schema: { type: object, required: [expire_date, previous], properties: { expire_date: { type: string }, previous: { type: string } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /app/subscriptions/{id}/logo:
    get:
      tags: [app]
      summary: 订阅上传的图标（PNG，修订第 213 条）
      security: [{ deviceToken: [] }]
      description: 与 Web 的图标相同；授权范围不是“全部节点”或没有上传图标时返回 404。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: PNG 图片, content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /app/push:
    put:
      tags: [app]
      summary: 登记或更新本机的推送 Token 与加密公钥（设计 18.11、30）
      security: [{ deviceToken: [] }]
      description: |
        告警经 Push Relay 推送到本机，内容用 public_key 以 HPKE 加密（30.3），Relay 与 APNs / FCM 只能看到密文。
        public_key 为 X25519 公钥（32 字节，标准 Base64）；配对时已提交的可省略。只推送授权范围内节点的告警。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider: { type: string, enum: [apns, fcm] }
                token: { type: string, description: APNs 设备 Token（十六进制）或 FCM 注册 Token }
                public_key: { type: string, description: X25519 公钥（32 字节，标准 Base64） }
      responses:
        '204': { description: 已登记 }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [app]
      summary: 关闭本机推送（删除推送 Token）
      security: [{ deviceToken: [] }]
      responses:
        '204': { description: 已关闭 }
        '401': { $ref: '#/components/responses/Error' }

  /app/unpair:
    post:
      tags: [app]
      summary: App 主动解除本机配对（吊销本设备）
      security: [{ deviceToken: [] }]
      responses:
        '204': { description: 已解除 }
        '401': { $ref: '#/components/responses/Error' }

  /ws:
    servers: [{ url: / }]
    get:
      tags: [events]
      summary: 实时事件（WebSocket，设计 20、45.2）；面板只推送，不接收指令
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      description: |
        Web：会话 Cookie 认证，Origin 必须是面板自身（防止跨站 WebSocket 劫持），缺少 Origin 时拒绝。
        脚本：Authorization: Bearer api_… 认证（不需要 Origin），只收到 API Key 范围内节点的事件；Key 吊销后以 1008 关闭。
        App：Authorization: Bearer dev_… 认证，只收到设备授权范围内节点的事件；设备被吊销后以 1008 关闭
        （连接建立后不因 Access Token 到期而断开，每 30 秒按设备状态重新校验）。
        握手成功后每条消息是一个 WsEvent（JSON 文本帧）。面板每 30 秒 ping 一次并重新校验会话，
        会话失效时以 1008 关闭；页面断线后自动重连，重连后应重新拉取数据（断线期间的事件不补发）。
      responses:
        '101': { description: 已切换为 WebSocket，之后推送 WsEvent }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /agent/enroll:
    post:
      tags: [agent]
      summary: 用一次性注册码换取 Agent Token（设计 27.6.2）
      description: |
        无需 Token，凭注册码认证；按 IP 单独限流（每分钟 10 次，失败过多临时封禁，设计 27.6.5）。
        注册码不存在、已使用、已撤销、已过期统一返回 enroll_code_invalid，不区分原因。
        注册成功后 10 分钟内，同一 machine_id_hash 用同一注册码重试，视为幂等重试：签发新 Token 并吊销上一个（设计 27.6.4）。
        新 Agent 注册成功后，该节点之前的 Token 全部吊销（设计 27.8）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '200':
          description: 注册成功。agent_token 只在此返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403':
          description: 节点为严格核对模式且主机信息不一致（设计 27.6.3），或 server_id 与注册码所属节点不符；注册码保持可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /agent/report:
    post:
      tags: [agent]
      summary: Agent 定时上报（设计 6）
      description: >-
        只按 Token 哈希确定节点，请求体中的节点标识不可信（设计 1.6.6）。请求体上限 64 KB（压缩时原始与解压后都受限）。
        响应头 Accept-Encoding: gzip 声明接受压缩；Agent 看到后以 Content-Encoding: gzip 发送（设计 6.1）。
        响应头 X-Report-Features: unchanged 声明接受省略未变化的 ports / firewall / proxies（修订第 271 条）。
      parameters:
        - name: Content-Encoding
          in: header
          required: false
          schema: { type: string, enum: [gzip, identity] }
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Report' }
      responses:
        '204':
          description: 已接收
          headers:
            Accept-Encoding: { schema: { type: string, example: gzip }, description: 面板接受的上报压缩方式 }
            X-Report-Interval: { schema: { type: integer, example: 10 }, description: 该节点的采样间隔（秒）；Agent 只接受 5～60（设计 6.1） }
            X-Report-Features: { schema: { type: string, example: unchanged }, description: 面板支持的上报功能，逗号分隔（修订第 271 条） }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' } # 省略了未变化的字段，但面板没有上一份可以补全（如面板刚重启）；Agent 改发完整上报
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }

  /releases/{version}/{file}:
    servers: [{ url: / }]
    get:
      tags: [agent]
      summary: 面板镜像：下载官方发布文件（设计 27.5.3），无需凭证
      description: |
        只提供已完整镜像（--release-mirror 同步或 release import 导入）且仍能验签的版本中，清单列出的构建与安装脚本，
        以及 manifest.json(.minisig)、签名的 SHA256SUMS(.minisig)、脚本的 .minisig。构建与脚本发出前核对清单中的 SHA256；
        不一致或不在清单中的文件返回 404。注意此路径不在 /api/v1 之下。
      security: []
      parameters:
        - { name: version, in: path, required: true, schema: { type: string, example: v0.3.0 } }
        - { name: file, in: path, required: true, schema: { type: string, example: vpsmon-agent-linux-amd64 } }
      responses:
        '200': { description: 文件内容, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { description: 版本未镜像、文件不在清单中或校验不通过 }

  /agent/upgrade:
    get:
      tags: [agent]
      summary: Agent 查询本节点的升级任务（设计 29.4、29.13）
      description: |
        有进行中的任务时返回目标版本与官方签名的清单原文（base64）及 minisign 签名。
        【安全】面板只转交官方签名的内容；Agent 与特权 updater 都用内置公钥独立验签并拒绝降级，面板无法让节点执行其他内容。
        首次获取时任务从 pending 变为 delivered。Agent 只在主机启用了远程升级（安装了 updater）时查询。
      security:
        - agentToken: []
      responses:
        '200':
          description: 升级任务
          content:
            application/json:
              schema:
                type: object
                required: [upgrade]
                properties:
                  upgrade: { type: boolean }
                  task_id: { type: integer }
                  version: { type: string }
                  manifest: { type: string, format: byte, description: 签名清单原文（base64） }
                  manifest_signature: { type: string, description: manifest.json.minisig 原文 }
                  mirror_path: { type: string, example: /releases, description: 可选：目标版本已镜像时，Agent 从“自己配置的面板地址 + 此路径”下载构建（设计 27.5.3） }
        '401': { $ref: '#/components/responses/Error' }

  /agent/upgrade/status:
    post:
      tags: [agent]
      summary: Agent 上报升级进度与结果（设计 29.12）
      description: 只能更新本节点进行中的任务；staged 表示已下载、校验并交给 updater。
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, status]
              properties:
                task_id: { type: integer }
                status: { type: string, enum: [staged, success, failed, rolled_back] }
                reason: { type: string, maxLength: 300 }
      responses:
        '204': { description: 已记录 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /agent/whoami:
    get:
      tags: [agent]
      summary: 校验 Agent Token 并返回所属节点（vpsmon-agent doctor 使用，设计 27.11）；只读，不改变任何状态
      security:
        - agentToken: []
      responses:
        '200':
          description: Token 有效
          content:
            application/json:
              schema:
                type: object
                required: [server_id, server_name, panel_version, time]
                properties:
                  server_id: { type: integer }
                  server_name: { type: string }
                  panel_version: { type: string }
                  time: { type: integer, description: 面板当前时间，Unix 秒（诊断时钟偏差） }
        '401': { $ref: '#/components/responses/Error' }

  /agent/unregister:
    post:
      tags: [agent]
      summary: Agent 本地卸载时通知面板（设计 27.11）
      description: 吊销该节点全部 Agent Token，节点回到「待安装」；历史数据与流量统计保留。
      security:
        - agentToken: []
      responses:
        '204': { description: 已注销 }
        '401': { $ref: '#/components/responses/Error' }

  /alerts:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [alerts]
      summary: 告警事件，按时间倒序（设计 19.9）
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [active, resolved, all], default: active }, description: active 为正在告警（firing） }
        - { name: server_id, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 告警事件
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/AlertEvent' } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /system-events:
    get:
      tags: [alerts]
      summary: 系统事件（修订第 163 条）：Agent 升级结果、到期提醒、面板自身告警与自检，最新在前，保留 180 天
      description: |
        与告警事件（/alerts）分开：这些事件没有触发 / 恢复两个状态，只是一条记录。
        只读 API Key 与 App 设备按授权范围过滤；不属于某个节点的事件（证书、云账户、面板）只有“全部节点”范围才能看到。
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: 上一页的 next_cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: server_id, in: query, schema: { type: integer, minimum: 1 }, description: 只看这个节点的事件（修订第 273 条） }
        - { name: kind, in: query, schema: { type: string, enum: [upgrade, reminder, panel, change] }, description: 只看这一种事件 }
      responses:
        '200':
          description: 事件列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/SystemEvent' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /alert-rules:
    get:
      tags: [alerts]
      summary: 全部告警规则（全局 / 分组 / 节点三层，设计 16.2）
      responses:
        '200':
          description: 规则
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多（此列表不分页，恒为空） }
                  items: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [alerts]
      summary: 为分组或节点新增覆盖：以同 rule_key 的全局规则为基础，应用请求中的字段
      requestBody:
        required: true
        content:
            application/json:
              schema:
                type: object
                required: [rule_key, scope_type, scope_id]
                properties:
                  rule_key: { type: string }
                  scope_type: { type: string, enum: [group, server] }
                  scope_id: { type: string, description: 分组名或节点 ID }
                  threshold: { type: number }
                  recover_threshold: { type: number, description: 不高于触发阈值 }
                  duration_s: { type: integer, minimum: 0, maximum: 86400 }
                  recover_duration_s: { type: integer, minimum: 0, maximum: 86400 }
                  severity: { type: string, enum: [info, warning, critical] }
                  repeat_interval_s: { type: integer, minimum: 0, maximum: 604800 }
                  enabled: { type: boolean }
      responses:
        '201': { description: 新增的规则, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /alert-rules/{id}:
    put:
      tags: [alerts]
      summary: 修改规则；省略的字段保持不变；类型、rule_key、层级不可改
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      requestBody:
        required: true
        content:
            application/json:
              schema:
                type: object
                properties:
                  threshold: { type: number }
                  recover_threshold: { type: number, description: 不高于触发阈值 }
                  duration_s: { type: integer, minimum: 0, maximum: 86400 }
                  recover_duration_s: { type: integer, minimum: 0, maximum: 86400 }
                  severity: { type: string, enum: [info, warning, critical] }
                  repeat_interval_s: { type: integer, minimum: 0, maximum: 604800 }
                  enabled: { type: boolean }
      responses:
        '200': { description: 修改后的规则, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [alerts]
      summary: 删除分组 / 节点覆盖（回到上一层的设置）；默认规则不能删除（422），可以关闭
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /alert-rules/preview:
    post:
      tags: [alerts]
      summary: 预览“按当前数据，此规则会对几台节点触发”（设计 16.2）；只比较阈值，不含持续时间
      description: 请求同新增或修改（带 id 表示修改现有规则）；被下层覆盖或关闭的节点不计入
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: 预览结果
          content:
            application/json:
              schema:
                type: object
                required: [matching, total, items]
                properties:
                  matching: { type: integer }
                  total: { type: integer, description: 由此规则决定的节点数 }
                  items: { type: array, items: { type: object, required: [server_id, name, value], properties: { server_id: { type: integer }, name: { type: string }, value: { type: number }, detail: { type: string } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /agent-releases:
    get:
      tags: [servers]
      summary: 已同步并验签的官方 Agent 版本，最新在前（设计 29.1、29.20）
      responses:
        '200':
          description: 版本列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items, auto_sync, source, mirror], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/AgentRelease' } }, auto_sync: { type: boolean }, source: { type: string }, mirror: { type: boolean, description: 是否开启 --release-mirror } } } } }
        '401': { $ref: '#/components/responses/Error' }

  /agent-releases/sync:
    post:
      tags: [servers]
      summary: 立即从官方发布地址同步最新版本并验签；验签失败的版本不会被记录
      responses:
        '200': { description: 同步到的版本, content: { application/json: { schema: { type: object, required: [version, channel], properties: { version: { type: string }, channel: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /upgrade-tasks:
    get:
      tags: [servers]
      summary: 远程升级任务，最新在前（最多 100 个，设计 29.14）
      parameters:
        - { name: server_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 任务列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/UpgradeTask' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [servers]
      summary: 为节点创建升级任务（设计 29.14）
      description: |
        version 必须是已同步并验签的官方版本。尚未安装、当前版本不低于目标版本、已有进行中任务的节点会被跳过并说明原因。
        只有 Web 管理员可以创建；App 凭证不能（CLAUDE.md 约束 5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_ids, version]
              properties:
                server_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 500 }
                version: { type: string, example: '0.3.0' }
      responses:
        '201':
          description: 创建结果
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped]
                properties:
                  created: { type: array, items: { $ref: '#/components/schemas/UpgradeTask' } }
                  skipped: { type: array, items: { type: object, required: [server_id, reason], properties: { server_id: { type: integer }, reason: { type: string } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /upgrade-tasks/{id}/cancel:
    post:
      tags: [servers]
      summary: 取消尚未交给 updater 的升级任务（pending / delivered）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 已取消 }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /upgrade-rollouts:
    get:
      tags: [servers]
      summary: 灰度升级，最新在前（最多 20 个，设计 29.16）
      responses:
        '200':
          description: 灰度升级列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/UpgradeRollout' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [servers]
      summary: 创建灰度升级并立即开始第一批（设计 29.16）
      description: |
        节点按 server_ids 的顺序分批升级。每批全部结束后观察 observe_minutes 分钟：本批失败（失败 / 回滚）超过 max_failures 台，
        或本次已升级成功的节点离线时自动暂停；否则开始下一批，最后一批结束后完成。
        不符合条件的节点（待安装、版本不低于目标、未启用远程升级等）在轮到时跳过并记录原因，由后面的节点补足该批数量。
        同一时间只能有一个进行中（running / paused）的灰度升级。只有 Web 管理员可以操作；App 凭证不能（CLAUDE.md 约束 5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_ids, version, stages]
              properties:
                server_ids: { type: array, items: { type: integer }, minItems: 2, maxItems: 500, description: 参与的节点，按升级顺序 }
                version: { type: string, example: '0.4.0' }
                stages: { type: array, minItems: 2, maxItems: 5, items: { $ref: '#/components/schemas/RolloutStage' }, description: 各批累计规模；最后一批总是全部 }
                observe_minutes: { type: integer, minimum: 5, maximum: 1440, description: 每批结束后的观察时间，默认 30 }
                max_failures: { type: integer, minimum: 0, maximum: 100, description: 每批允许的失败台数，超过即暂停，默认 0 }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradeRollout' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /upgrade-rollouts/{id}/{action}:
    post:
      tags: [servers]
      summary: 暂停 / 继续 / 取消灰度升级
      description: |
        pause：不再开始新的批次（已下发的任务照常完成）；resume：继续（重新开始当前批的观察）；
        cancel：结束灰度升级，并取消尚未交给 updater 的任务。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [pause, resume, cancel] } }
      responses:
        '204': { description: 已执行 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /settings/quiet-hours:
    get:
      tags: [alerts]
      summary: 免打扰时段（设计 16.5）
      responses:
        '200': { description: 当前设置, content: { application/json: { schema: { $ref: '#/components/schemas/QuietHoursView' } } } }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [alerts]
      summary: 修改免打扰时段（记入操作日志 setting.update）
      description: |
        免打扰期间：严重告警按 critical 设置（notify 仍然通知 / summary 与警告一起汇总）；警告暂存，结束后汇总为一条，
        按渠道的最低级别裁剪；提示不发送。面板自检与测试通知不受影响。暂存在内存中，面板重启会丢失尚未汇总的通知。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuietHours' } } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/QuietHoursView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /settings/heartbeat:
    get:
      tags: [alerts]
      summary: 面板心跳（设计 1.10.3）：定时请求外部监控服务的地址，面板自己停止时由那边告警
      responses:
        '200': { description: 当前设置与最近一次结果, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatView' } } } }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [alerts]
      summary: 修改面板心跳（记入操作日志 setting.update）
      description: url 留空表示保留已保存的地址；地址只支持 HTTPS（本机回环地址除外），不跟随重定向。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatInput' } } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /site:
    get:
      tags: [system]
      summary: 网站配置中显示用的部分（设计 52）：应用名称、界面语言、登录是否需要验证码；无需登录（登录页使用）
      security: []
      responses:
        '200': { description: 网站配置, content: { application/json: { schema: { $ref: '#/components/schemas/SiteView' } } } }

  /settings/site:
    put:
      tags: [system]
      summary: 修改网站配置（应用名称、语言、登录验证码；记入操作日志 setting.update）
      description: '启动参数 --no-login-captcha 关闭了验证码时，captcha 总是保存为 false。关闭验证码不影响登录限速。'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SiteSetting' } } } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/SiteView' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /settings/listen:
    get:
      tags: [system]
      summary: 监听端口（设计 51）：Web 端口、Agent 专用端口与 Agent 地址
      responses:
        '200': { description: 当前设置与生效情况, content: { application/json: { schema: { $ref: '#/components/schemas/ListenSetting' } } } }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [system]
      summary: 修改监听端口，保存后立即生效（不重启；记入操作日志 setting.update）
      description: '先尝试监听新地址，失败（端口被占用等）时返回 409，什么都不改。修改 Web 端口后旧端口继续监听，直到调用 close-old 或面板重启，避免反向代理还没改好就连不上。反向代理模式下两个地址都只能是本机回环地址（对外的 HTTPS 由反向代理负责）。'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ListenSettingInput' } } } }
      responses:
        '200': { description: 已生效, content: { application/json: { schema: { $ref: '#/components/schemas/ListenSetting' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /settings/listen/close-old:
    post:
      tags: [system]
      summary: 关闭修改前的旧 Web 端口（确认新地址可以访问后调用）
      responses:
        '200': { description: 已关闭, content: { application/json: { schema: { $ref: '#/components/schemas/ListenSetting' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /settings/ipinfo:
    get:
      tags: [servers]
      summary: 节点 IP 信息（ASN、位置）查询开关（设计 49）
      responses:
        '200': { description: 当前设置, content: { application/json: { schema: { $ref: '#/components/schemas/IPInfoSetting' } } } }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [servers]
      summary: 打开或关闭 ipinfo.io 查询（记入操作日志 setting.update）
      description: '默认关闭（设计 1.8：IP 上传默认关闭）。打开后面板每周把各节点的公网 IP 发给 ipinfo.io 查询 ASN 与位置；关闭时不发送任何 IP，已保存的结果保留。'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IPInfoSetting' } } } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/IPInfoSetting' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /servers/{id}/ipinfo:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [servers]
      summary: 立即查询一次节点的 IP 信息（开关关闭时 409；节点没有公网 IP 时 422）
      responses:
        '200': { description: 查询结果, content: { application/json: { schema: { $ref: '#/components/schemas/IPInfo' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/unlock-check:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [servers]
      summary: 请求节点的 Agent 检测一次流媒体与网站解锁（设计 50）
      description: 'Agent 下一次上报时开始检测（检测项内置在 Agent 中），约 1 分钟内随上报带回结果；已在检测中时直接返回当前状态。节点离线或 Agent 版本不支持时 409。'
      responses:
        '200': { description: 当前检测状态, content: { application/json: { schema: { $ref: '#/components/schemas/UnlockView' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /settings/heartbeat/test:
    post:
      tags: [alerts]
      summary: 立即发送一次心跳并返回结果（未保存地址时 422）
      responses:
        '200': { description: 已发送（结果见 last_ok / last_status / last_error）, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatView' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /notification-channels:
    get:
      tags: [alerts]
      summary: 通知渠道（设计 16.5、31）；凭证已脱敏
      responses:
        '200':
          description: 渠道列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/NotifyChannel' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [alerts]
      summary: 添加通知渠道（记入操作日志）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotifyChannelInput' } } }
      responses:
        '201': { description: 已添加（脱敏）, content: { application/json: { schema: { $ref: '#/components/schemas/NotifyChannel' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /notification-channels/{id}:
    put:
      tags: [alerts]
      summary: 修改通知渠道；类型不可修改，凭证字段留空保持原值
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotifyChannelInput' } } }
      responses:
        '200': { description: 已修改（脱敏）, content: { application/json: { schema: { $ref: '#/components/schemas/NotifyChannel' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [alerts]
      summary: 删除通知渠道（投递记录保留）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /notification-channels/{id}/test:
    post:
      tags: [alerts]
      summary: 发送测试通知（同步发送一次，不重试；停用的渠道也可测试）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 发送结果；失败原因不含请求地址与凭证
          content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean }, error: { type: string } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /notification-deliveries:
    get:
      tags: [alerts]
      summary: 通知投递记录，最新在前（保留 30 天，设计 18.15）
      parameters:
        - { name: event_id, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 投递记录
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/Delivery' } } } } } }
        '401': { $ref: '#/components/responses/Error' }

  /settings/probe:
    get:
      tags: [servers]
      summary: 三网延迟的设置（设计 42.3.2）
      responses:
        '200': { description: 设置, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeSettings' } } } }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [servers]
      summary: 修改三网延迟的测试频率（所有节点），随下一份上报下发给各 Agent
      description: Agent 端硬性限制每轮间隔不短于 60 秒（设计 42.6）；上一轮结束后才计时，目标多时不会重叠。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeSettings' } } } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeSettings' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /probe-targets:
    get:
      tags: [servers]
      summary: 三网延迟的探测目标（设计 42.3.2）：内置三大运营商各省地址在前，自定义在后
      parameters:
        - { name: server_id, in: query, schema: { type: integer }, description: 再加上这台节点自己的目标；省略时只列共用目标 }
      responses:
        '200':
          description: 列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 始终为空 }, items: { type: array, items: { $ref: '#/components/schemas/ProbeTarget' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [servers]
      summary: 添加自定义探测目标
      description: |
        【安全】只接受公网 IP（不接受域名，拒绝内网、回环、链路本地与保留地址），协议只有 tcp / icmp。
        启用的目标最多 64 个（Agent 的上限，设计 42.6）；自定义目标最多 100 个。修改后随下一份上报下发给各 Agent。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeTargetInput' } } } }
      responses:
        '201': { description: 已添加, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeTarget' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /probe-targets/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [servers]
      summary: 修改探测目标（内置目标只能修改协议、端口、启用与备注）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeTargetInput' } } } }
      responses:
        '200': { description: 已修改, content: { application/json: { schema: { $ref: '#/components/schemas/ProbeTarget' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [servers]
      summary: 删除自定义目标与它的探测记录（内置目标返回 409，只能停用）
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /service-monitors:
    get:
      tags: [alerts]
      summary: 服务监控（设计 33.2），异常的在前
      responses:
        '200':
          description: 列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/ServiceMonitor' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [alerts]
      summary: 添加服务监控并立即检查一次
      description: |
        面板按 interval_s 检查：http（HTTP / HTTPS，始终校验证书）、tcp（端口能否连接）、dns（能否解析，可要求包含某个 IP）。
        连续 fail_threshold 次失败判为异常并发送通知，恢复时再通知一次（经通知渠道与 App 推送，遵守免打扰）。最多 200 个。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceMonitorInput' } } } }
      responses:
        '201': { description: 已添加, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceMonitor' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /service-monitors/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [alerts]
      summary: 修改服务监控（检查结果与历史保留）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceMonitorInput' } } } }
      responses:
        '200': { description: 已修改, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceMonitor' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [alerts]
      summary: 删除服务监控与它的检查记录
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /service-monitors/{id}/check:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [alerts]
      summary: 立即检查一次（不改变检查周期；结果计入状态判断）
      responses:
        '200': { description: 检查后的状态, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceMonitor' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /service-monitors/{id}/checks:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [alerts]
      summary: 检查记录（最近 24 小时或 7 天；7 天按 10 分钟汇总）
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [24h, 7d], default: 24h } }
      responses:
        '200':
          description: 按时间排序
          content:
            application/json:
              schema:
                type: object
                required: [next_cursor, items]
                properties:
                  next_cursor: { type: string, description: 始终为空（一次返回整个时间范围） }
                  items:
                    type: array
                    items:
                      type: object
                      required: [ts, ok, total, latency_ms]
                      properties:
                        ts: { type: integer }
                        ok: { type: integer, description: 成功次数（24h 时每点一次检查，为 0 或 1） }
                        total: { type: integer, description: 检查次数 }
                        latency_ms: { type: ['integer', 'null'], description: 成功检查的平均耗时；全部失败时为 null }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /ssl-monitors:
    get:
      tags: [alerts]
      summary: SSL 证书到期监控（设计 33.3），快到期的在前
      responses:
        '200':
          description: 列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/SSLMonitor' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [alerts]
      summary: 添加证书监控并立即检查一次（最多 15 秒）
      description: 面板每 12 小时连接一次，始终校验证书；30 / 14 / 7 / 3 / 1 天、当天与已过期各提醒一次，证书无效时提醒一次。最多 200 个。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string, description: '域名或 IP；也可以是 example.com:8443 或粘贴的网址' }
                port: { type: integer, minimum: 1, maximum: 65535, description: 默认 443 }
                note: { type: string, maxLength: 100 }
      responses:
        '201': { description: 已添加, content: { application/json: { schema: { $ref: '#/components/schemas/SSLMonitor' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /ssl-monitors/{id}/check:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [alerts]
      summary: 立即重新检查
      responses:
        '200': { description: 检查结果, content: { application/json: { schema: { $ref: '#/components/schemas/SSLMonitor' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /ssl-monitors/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    delete:
      tags: [alerts]
      summary: 删除证书监控
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /fx-rates:
    get:
      tags: [subscriptions]
      summary: 汇率：1 单位外币折合多少人民币（修订第 223 条）
      description: |
        用于把订阅的外币价格换算成人民币显示与统计。来源 ExchangeRate-API（open.er-api.com，每日更新）；面板每 12 小时最多请求一次，
        只在有非人民币订阅时请求，请求不带任何用户数据。汇率过期时本次先返回已有的汇率并在后台刷新；从未取到时 rates 只有 CNY。
      responses:
        '200': { description: 汇率, content: { application/json: { schema: { $ref: '#/components/schemas/FxRates' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /subscriptions:
    get:
      tags: [subscriptions]
      summary: 订阅列表（设计 47），按下次扣费日排序，已结束的在后
      responses:
        '200':
          description: 列表
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [subscriptions]
      summary: 添加订阅（最多 500 个）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionInput' } } } }
      responses:
        '201': { description: 已添加, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /subscriptions/{id}/renew:
    post:
      tags: [subscriptions]
      summary: 已续费：订阅结束日期顺延一个订阅周期（修订第 224 条）
      description: 只适用于填写了结束日期的订阅（手动续费的 VPS、域名等），从原结束日期按订阅周期顺延；没有结束日期或一次性付费时返回 409。Web 管理员；记审计日志。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: 续费后的订阅, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /subscriptions/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [subscriptions]
      summary: 修改订阅（整体替换）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionInput' } } } }
      responses:
        '200': { description: 已修改, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [subscriptions]
      summary: 删除订阅
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /subscriptions/{id}/logo:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [subscriptions]
      summary: 上传的图标（PNG）
      responses:
        '200': { description: 图标, content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [subscriptions]
      summary: 上传图标（替换）
      description: '请求体为 PNG（不超过 256 KB，边长 16～512 像素；Web 先在浏览器中裁剪缩放为 128×128）。面板解码后重新编码保存，不保存原文件；不接受 SVG。'
      requestBody: { required: true, content: { image/png: { schema: { type: string, format: binary } } } }
      responses:
        '200': { description: 已上传, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [subscriptions]
      summary: 删除上传的图标（恢复内置标志或首字母）
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /silences:
    get:
      tags: [alerts]
      summary: 生效中的静音与维护（设计 16.6），最新在前
      security: [{ session: [] }, { deviceToken: [] }]
      description: App 设备需允许低风险操作，只返回授权范围内节点的记录以及全局 / 按规则的静音（设计 8.4.1）。
      responses:
        '200':
          description: 静音与维护
          content: { application/json: { schema: { type: object, required: [next_cursor, items], properties: { next_cursor: { type: string, description: 空表示没有更多 }, items: { type: array, items: { $ref: '#/components/schemas/Silence' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [alerts]
      summary: 新增静音或维护；同一对象同一类型已有生效记录时以新设置为准
      security: [{ session: [] }, { deviceToken: [] }]
      description: App 设备需允许低风险操作（否则 403），且只能针对授权范围内的单个节点：scope_type 不是 server 时 422，范围外的节点 404（设计 8.4.1、17.3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, scope_type]
              properties:
                kind: { type: string, enum: [mute, maintenance], description: 维护只能针对单个节点 }
                scope_type: { type: string, enum: [server, group, rule, global] }
                scope_id: { type: string, description: 节点 ID、分组名或 rule_key；global 时省略 }
                duration: { type: string, enum: ['', '1h', '8h', '24h'], description: 空表示直到手动结束 }
                reason: { type: string, maxLength: 200 }
      responses:
        '201': { description: 新增的记录, content: { application/json: { schema: { $ref: '#/components/schemas/Silence' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /silences/{id}:
    delete:
      tags: [alerts]
      summary: 立即结束静音或维护（保留记录）
      security: [{ session: [] }, { deviceToken: [] }]
      description: App 设备需允许低风险操作，只能结束授权范围内单个节点的记录。
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '204': { description: 已结束 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /audit-logs:
    get:
      tags: [audit]
      summary: 审计日志：登录日志与操作日志（设计 24.8），按时间倒序；只读，不提供修改或删除
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [login, operation] }, description: 'login：登录、退出、二次验证；operation：其他操作；省略为全部' }
        - { name: result, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: actor, in: query, schema: { type: string, enum: [admin, viewer, agent, apikey, app, cli, system] }, description: 主体类型 }
        - { name: action, in: query, schema: { type: string }, description: '操作：精确匹配；以 “.” 结尾时按前缀匹配（如 server.）' }
        - { name: from, in: query, schema: { type: integer }, description: 起始时间（含），Unix 秒 }
        - { name: to, in: query, schema: { type: integer }, description: 结束时间（不含），Unix 秒 }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的 next_cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 审计记录
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多 }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, ts, actor_type, actor_id, action, target_type, target_id, target_name, result, client_ip, user_agent, details]
                      properties:
                        id: { type: integer }
                        ts: { type: integer }
                        actor_type: { type: string, enum: [admin, viewer, agent, apikey, app, cli, system] }
                        actor_id: { type: string, description: 管理员用户名（登录失败时为填写的用户名）或节点 ID }
                        action: { type: string, example: server.create }
                        target_type: { type: string }
                        target_id: { type: string }
                        target_name: { type: string, description: 对象为节点且仍存在时的名称 }
                        result: { type: string, enum: [success, failure] }
                        client_ip: { type: string }
                        user_agent: { type: string }
                        details: { type: object, description: 已脱敏（设计 24.7） }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /audit-logs/export:
    get:
      tags: [audit]
      summary: 导出审计日志为 CSV（设计 24.8），筛选参数同 /audit-logs，最多 10000 条，按时间倒序
      description: >-
        UTF-8（带 BOM，Excel 可直接打开中文）。以 = + - @ 开头的单元格前加单引号，防止表格软件把内容当作公式执行。
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [login, operation] } }
        - { name: result, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: actor, in: query, schema: { type: string, enum: [admin, viewer, agent, apikey, app, cli, system] } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
      responses:
        '200':
          description: CSV 文件
          content:
            text/csv: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cloud-accounts:
    get:
      tags: [cloud]
      summary: 云账户列表（不含凭证，只有末 4 位提示）
      responses:
        '200':
          description: 账户列表
          content:
            application/json:
              schema:
                type: object
                required: [next_cursor, items]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多 }
                  items: { type: array, items: { $ref: '#/components/schemas/CloudAccount' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [cloud]
      summary: 添加云账户（需在 10 分钟内重新验证过密码，设计 17.4、44.2）；添加后立即在后台同步一次
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloudAccountInput' }
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudAccount' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cloud-accounts/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [cloud]
      summary: 修改云账户；credential 留空表示不变，提供时需重新验证密码，并清除“凭证失效”状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloudAccountInput' }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudAccount' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [cloud]
      summary: 删除云账户及同步的费用与实例（需重新验证密码）
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /cloud-accounts/{id}/sync:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [cloud]
      summary: 立即在后台同步一次全部数据（同一账户 1 分钟内只允许一次）；结果见账户的 *_synced_at 与 last_error
      responses:
        '202': { description: 已开始同步 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cloud-accounts/{id}/check:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [cloud]
      summary: 权限检查——逐项调用一次只读接口，返回每项是否可用与结果摘要（设计 44.2，修订第 204 条）；目前只支持阿里云；同一账户 10 秒内只允许一次
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CloudCheckItem' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cloud-accounts/{id}/costs:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [cloud]
      summary: 按月费用，最新在前（最多 24 个月）
      responses:
        '200':
          description: 按月费用
          content:
            application/json:
              schema:
                type: object
                required: [next_cursor, items]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多 }
                  items: { type: array, items: { $ref: '#/components/schemas/CloudCost' } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /cloud-instances:
    get:
      tags: [cloud]
      summary: 云厂商的实例列表
      parameters:
        - { name: account_id, in: query, schema: { type: integer }, description: 只看某个账户 }
        - { name: server_id, in: query, schema: { type: integer }, description: 只看关联到该节点的实例（节点详情） }
      responses:
        '200':
          description: 实例列表
          content:
            application/json:
              schema:
                type: object
                required: [next_cursor, items]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多 }
                  items: { type: array, items: { $ref: '#/components/schemas/CloudInstance' } }
        '401': { $ref: '#/components/responses/Error' }

  /cloud-instances/{id}/server:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [cloud]
      summary: 关联或取消关联节点（设计 44.5）；记入审计
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [server_id], properties: { server_id: { type: [integer, 'null'], description: null 表示取消关联 } } }
      responses:
        '200':
          description: 关联后的实例
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudInstance' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cloud-instances/{id}/auto-calibrate:
    put:
      tags: [cloud]
      summary: 打开或关闭自动流量校准（设计 44.5）；打开要求已关联节点且实例有流量包
      description: |
        打开后每天一次：云厂商的周期起点与节点本周期起点相同、且云厂商流量 36 小时内同步过时，以云厂商的本周期用量
        作为服务商数值校准节点（记入校准历史，审计主体 system）；对不上时不改节点，原因写入 calibrate_status。
        取消或更改关联时自动关闭。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200': { description: 实例, content: { application/json: { schema: { $ref: '#/components/schemas/CloudInstance' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cloud-instances/{id}/apply-expire:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [cloud]
      summary: 把关联实例的到期时间写入节点的到期日（按节点的计费时区取日期）；记入审计
      responses:
        '200':
          description: 写入的到期日
          content:
            application/json:
              schema: { type: object, required: [expire_date], properties: { expire_date: { type: string, description: YYYY-MM-DD } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /servers:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [servers]
      summary: 节点列表（实时状态取自内存）
      description: >-
        一次返回全部节点（总览的统计与筛选需要全量），next_cursor 恒为空；每核使用率、监听端口与扩展指标只在详情中返回（设计 19.0.2）。
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ServerView' } }
                  next_cursor: { type: string, description: 空表示没有更多 }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [servers]
      summary: 新建节点（状态：待安装），同时生成注册码（设计 19.11、27.2）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServerRequest' }
      responses:
        '201':
          description: 已创建。完整注册码只在此返回一次
          headers:
            Location: { schema: { type: string }, description: 新节点的路径 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollCodeView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/batch:
    post:
      tags: [servers]
      summary: 批量新建节点（设计 27.9）：全部校验通过才创建，每个节点独立的注册码
      description: |
        最多 200 个；字段与单个新建相同（每项的 enroll_ttl 忽略，以请求的 enroll_ttl 为准）。任一项不合法时都不创建，
        字段错误为 items[序号].字段（序号从 0 开始）；名称与已有节点或本批中的其他项重复也是错误。
        exports 提供三种导出：每台主机一条安装命令、CSV（名称, 注册码, 有效期, 命令）、Ansible inventory 与 playbook
        （先下载、按已验签的哈希校验、再执行；面板没有已验签的官方版本时为 null）。导出中含注册码，只返回这一次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/CreateServerRequest' } }
                enroll_ttl: { type: string, enum: ['1h', '24h', '7d'], description: 注册码有效期，默认 24h }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [items, exports]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EnrollCodeView' } }
                  exports:
                    type: object
                    required: [commands, csv, ansible]
                    properties:
                      commands: { type: string, description: 每台主机一条安装命令（文本） }
                      csv: { type: string, description: 'CSV：名称, 注册码, 有效期, 命令（UTF-8，带表头）' }
                      ansible: { type: ['string', 'null'], description: Ansible inventory 与 playbook（YAML）；没有已验签的官方版本时为 null }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/order:
    put:
      tags: [servers]
      summary: 保存节点的自定义顺序（设计 1.5.6，修订第 150 条）
      description: |
        ids 为节点 ID 的完整顺序，依次写入 sort_order = 1、2、3…；不在 ids 中的节点 sort_order 置 0（排在后面，按名称）。
        Web 的“自定义”排序与 App 的“自定义顺序”（本机没有自己的顺序时）都按它排列。记入操作日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 2000, items: { type: integer }, description: 不能重复，必须都是已有节点 }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/renew:
    post:
      tags: [servers]
      summary: 已续费：节点到期日顺延一个计费周期（修订第 224 条）
      description: 从原来的到期日算起（不是今天）按计费周期（月 / 季 / 半年 / 年 / 两年 / 三年付）顺延；没有到期日或一次性付费时返回 409。Web 管理员；记审计日志。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: 新的到期日
          content: { application/json: { schema: { type: object, required: [expire_date, previous], properties: { expire_date: { type: string }, previous: { type: string } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /servers/{id}:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      parameters:
        - { name: live, in: query, schema: { type: integer, enum: [1] }, description: '按需实时模式（设计 46.2）：Web 详情页可见时带 live=1，节点在随后 30 秒内以 2 秒采样；API Key 带此参数无效' }
      tags: [servers]
      summary: 单个节点（格式同列表中的一项）
      responses:
        '200':
          description: 节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [servers]
      summary: 修改节点信息（设计 19.5）
      description: 整体替换可编辑信息，字段同新建（enroll_ttl 忽略）；未提供的可选字段视为清空。不改变注册状态。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServerRequest' }
      responses:
        '200':
          description: 修改后的节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [servers]
      summary: 删除节点及其全部历史数据，不可恢复
      description: 该节点的 Agent Token 随之删除。敏感操作：需在 10 分钟内调用过 /auth/reauth，否则 403 reauth_required（设计 17.4）。
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/install-command:
    get:
      tags: [servers]
      summary: 查看安装命令与注册码状态
      description: 不返回已生成过的完整注册码，命令中只有脱敏提示；丢失后需重新生成（设计 19.11）。
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '200':
          description: 安装命令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollCodeView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/revoke-agent-token:
    post:
      tags: [servers]
      summary: 立即吊销节点的全部 Agent Token（设计 17.2、23.2）
      description: |
        Token 泄露时使用。节点回到“待安装”，历史数据与流量统计保留。恢复上报需新注册码：主机上执行
        `sudo vpsmon-agent rotate-token --enroll …`（或卸载后重新安装）。敏感操作：需 10 分钟内重新验证过密码。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/enroll-code:
    post:
      tags: [servers]
      summary: 重新生成注册码，旧码立即失效（设计 27.4）；对已注册节点即重新安装 / 更换主机（设计 27.8）
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                enroll_ttl: { $ref: '#/components/schemas/EnrollTTL' }
      responses:
        '200':
          description: 新注册码，完整值只在此返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollCodeView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [servers]
      summary: 撤销注册码
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '204': { description: 已撤销 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/metrics/history:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [servers]
      summary: 节点历史指标（设计 19.7）
      description: |
        按范围自动选择粒度（设计 21）：1h / 6h → 10 秒原始点；24h → 1 分钟；7d → 5 分钟；30d → 1 小时。
        平均值字段与原始点同名，*_max 为桶内最大值。
      parameters:
        - { $ref: '#/components/parameters/ServerID' }
        - name: range
          in: query
          schema: { type: string, enum: ['1h', '6h', '24h', '7d', '30d'], default: 1h }
      responses:
        '200':
          description: 历史曲线
          content:
            application/json:
              schema:
                type: object
                required: [range, resolution, items, next_cursor]
                properties:
                  next_cursor: { type: string, description: 按时间范围一次返回，恒为空（设计 19.0.2） }
                  range: { type: string, enum: ['1h', '6h', '24h', '7d', '30d'] }
                  resolution: { type: integer, description: 点的间隔，秒 }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MetricPoint' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/health:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [servers]
      summary: 节点健康摘要（设计 1.5.7）：把最近的指标归纳成几句话，Web 与 App 显示同一结论
      description: |
        CPU：过去 24 小时平均与峰值；内存：过去 24 小时的范围（波动不超过 10 个百分点时为“稳定”）；
        磁盘：当前使用率与最近 30 天增长（数据满 7 天才计算，增长时估算写满天数）；流量：本周期用量与预计。
        数据来自 5 分钟聚合（设计 21），最近几分钟可能尚未计入。
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '200': { description: 健康摘要, content: { application/json: { schema: { $ref: '#/components/schemas/HealthSummary' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/latency:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [servers]
      summary: 三网延迟（设计 42.3.2）：节点 Agent 到三大运营商各地目标的延迟与丢包
      description: |
        Agent 按设置的频率（默认每 5 分钟）测一轮，每个目标 5 个样本：延迟为成功样本的中位数，丢包率为失败样本占比。
        targets 中的 latency_ms / loss 为最近 1 小时的汇总；series 为曲线（24h 为逐轮，7d 按小时汇总）。保留 7 天。
      parameters:
        - { $ref: '#/components/parameters/ServerID' }
        - { name: range, in: query, schema: { type: string, enum: [24h, 7d], default: 24h } }
      responses:
        '200': { description: 三网延迟, content: { application/json: { schema: { $ref: '#/components/schemas/LatencyView' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /reach-probes:
    get:
      tags: [servers]
      summary: 国内探针（设计 42.2，修订第 154 条）
      description: 被设为国内探针的节点、各自的运营商、TCP 端口与是否 Ping，以及下发的探测项数（每台探针的 Agent 每轮最多 max_checks 项，含三网延迟目标）。
      responses:
        '200': { description: 探针, content: { application/json: { schema: { $ref: '#/components/schemas/ReachProbes' } } } }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [servers]
      summary: 设置国内探针（整体替换），随探针的下一份上报下发
      description: |
        探针每轮探测其他全部已安装节点注册时记录的公网 IPv4 / IPv6：Ping（可选，需要 Agent 有 CAP_NET_RAW）与最多 3 个 TCP 端口。
        至少选 Ping 或一个端口；最多 10 台探针。记入操作日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [probes]
              properties:
                probes: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ReachProbe' } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/ReachProbes' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/container-names:
    put:
      tags: [servers]
      summary: 设置容器名称（修订第 164 条）：整体替换，名称为空表示删除；最多 100 个（记入操作日志）
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names: { type: object, additionalProperties: { type: string, maxLength: 40 }, description: 容器 ID 前 12 位（十六进制）→ 名称 }
      responses:
        '200':
          description: 保存后的名称
          content: { application/json: { schema: { type: object, required: [names], properties: { names: { type: object, additionalProperties: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/containers/forget:
    post:
      tags: [servers]
      summary: 不再提醒已停止的容器（修订第 166 条）：以当前运行的容器为准，“容器已停止”告警随之恢复（记入操作日志）
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { label: { type: string, description: 只忘记这个主进程名；省略表示全部 } } } } }
      responses:
        '204': { description: 已更新 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/proxies/forget:
    post:
      tags: [servers]
      summary: 不再提醒没有运行的代理（修订第 169 条）：主动停用或卸载后点这里，“代理异常”告警中这部分随之恢复（记入操作日志）
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string, description: 只忘记这个代理；省略表示全部没有运行的 } } } } }
      responses:
        '204': { description: 已更新 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/exposure-check:
    post:
      tags: [servers]
      summary: 从面板检测公网可达（修订第 171 条）：对节点的公网地址逐个 TCP 连接它报告的、对公网开放的监听端口（记入操作日志）
      description: |
        只连接节点自己的公网地址与它自己报告的 TCP 监听端口（最多 50 个），连接成功即断开，不发送任何数据；UDP 不检测。
        手动触发：自动定时检测会在节点的日志里留下大量连接记录，fail2ban 等可能封禁面板地址。
        结果反映的是从面板所在网络能否访问，面板与节点在同一内网时可能比真实的公网暴露更多
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: 检测结果, content: { application/json: { schema: { $ref: '#/components/schemas/PortExposure' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/port-baseline:
    put:
      tags: [servers]
      summary: 设置端口基线（修订第 170 条）：允许对公网开放的监听端口；空数组表示取消（记入操作日志）
      description: |
        只比较对公网开放的监听端口（监听在 0.0.0.0、:: 或公网地址；只在回环或内网地址监听的不算）。
        不在基线中的为“未知监听端口”，基线中没有在监听的为“基线端口未监听”，各有一条默认启用的告警规则。最多 200 个
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ports]
              properties:
                ports: { type: array, maxItems: 200, items: { type: string }, description: '端口/协议，如 22/tcp；只写端口时为 tcp' }
                labels:
                  type: object
                  additionalProperties: { type: string, maxLength: 40 }
                  description: '修订第 258 条：基线端口的备注，键为规范化后的“端口/协议”（如 443/tcp），只能是 ports 中的端口；省略时保留原有备注（不在新 ports 中的丢弃），空字符串删除该备注'
      responses:
        '200':
          description: 保存后的基线（取消时 ports 为空数组）
          content: { application/json: { schema: { type: object, required: [ports, labels, updated_at], properties: { ports: { type: array, items: { type: string } }, labels: { type: object, additionalProperties: { type: string } }, updated_at: { type: integer } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/reach:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [servers]
      summary: 节点的国内可达性（设计 42.2、42.3.1）
      description: |
        各国内探针最近的判定（连续 3 轮异常才判定、连续 2 轮正常恢复；探针对所有节点都失败的轮次不计）、最近一轮的各探测项，
        以及最近 24 小时国内方向的延迟曲线。没有设置国内探针时 configured 为 false。结论均为“疑似”。
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '200': { description: 可达性, content: { application/json: { schema: { $ref: '#/components/schemas/ServerReach' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /latency-overview:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [servers]
      summary: 测速对比（设计 42.3.5）：全部节点到各目标最近 1 小时的延迟与丢包
      description: |
        与节点详情的“测速”同样的口径：latency_ms 为最近 1 小时成功轮次的中位数（全部失败时为 null），loss 为平均丢包率。
        只包含已安装的节点；API 密钥只返回其范围内的节点。targets 只包含最近 1 小时有结果的目标。
      responses:
        '200': { description: 测速对比, content: { application/json: { schema: { $ref: '#/components/schemas/LatencyOverview' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /servers/{id}/probe:
    get:
      tags: [servers]
      summary: 节点自己的三网延迟设置（设计 42.3.2）
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '200': { description: 设置, content: { application/json: { schema: { $ref: '#/components/schemas/NodeProbe' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [servers]
      summary: 修改节点自己的三网延迟设置，随这台节点的下一份上报下发
      description: |
        default：跟随全局（“监测 → 测速设置”中启用的目标与频率）；custom：这台节点自己勾选目标（不受全局启用影响，最多 64 个），
        频率可单独设置（0 表示跟随全局）；off：这台节点不测。节点本机的 no-probe 文件优先于这里的设置（设计 42.6）。
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NodeProbe' } } } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/NodeProbe' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/current:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [traffic]
      summary: 本计费周期流量、校准与预测（设计 19.8、5.7、32）；与节点中的 traffic 字段相同
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '200':
          description: 本周期流量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/daily:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [traffic]
      summary: 最近 N 天每日流量，按日期升序，无数据的日期补 0；hours 为当天有上报的小时数，用来区分零流量与未上报
      parameters:
        - { $ref: '#/components/parameters/ServerID' }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 400, default: 30 } }
      responses:
        '200':
          description: 每日流量
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多（此列表不分页，恒为空） }
                  items:
                    type: array
                    items:
                      type: object
                      required: [day, rx, tx, used, hours]
                      properties:
                        day: { type: string, format: date }
                        rx: { type: integer }
                        tx: { type: integer }
                        used: { type: integer, description: 按计费模式取值并乘以系数；不含校准 }
                        hours: { type: integer, minimum: 0, maximum: 24, description: '修订第 235 条：当天（流量时区）有上报的小时数；0 表示当天没有上报，流量 0 不是“零流量”。今天为截至目前' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/monthly:
    get:
      security: [{ session: [] }, { apiKey: [] }, { deviceToken: [] }]
      tags: [traffic]
      summary: 最近 N 个计费周期（含当前），最新在前；历史周期按当前的计费模式、系数与额度计算
      parameters:
        - { $ref: '#/components/parameters/ServerID' }
        - { name: cycles, in: query, schema: { type: integer, minimum: 1, maximum: 36, default: 12 } }
      responses:
        '200':
          description: 每个计费周期的流量
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多（此列表不分页，恒为空） }
                  items:
                    type: array
                    items:
                      type: object
                      required: [cycle_start, cycle_end, rx, tx, adjustment, used, limit]
                      properties:
                        cycle_start: { type: string, format: date }
                        cycle_end: { type: string, format: date, description: 下一周期开始日（不含） }
                        rx: { type: integer }
                        tx: { type: integer }
                        adjustment: { type: integer }
                        used: { type: integer }
                        limit: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/calibrate:
    post:
      tags: [traffic]
      summary: 手动校准本周期已用流量（设计 5.7）
      description: 偏差 = 填写值 − 当前统计值，只作用于当前周期；再次校准覆盖之前的偏差，不累加。同时记录原始收发字节，之后修改系数或计费模式时按新设置重算偏差（设计 5.7）。
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [used_gb]
              properties:
                used_gb: { type: number, minimum: 0, description: 服务商面板显示的已用量，按节点的 traffic_unit 口径 }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 校准后的本周期流量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /servers/{id}/traffic/adjustments:
    get:
      tags: [traffic]
      summary: 校准历史（最近 50 条，最新在前）
      parameters: [{ $ref: '#/components/parameters/ServerID' }]
      responses:
        '200':
          description: 校准记录
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string, description: 空表示没有更多（此列表不分页，恒为空） }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, cycle_start, measured_bytes, reported_bytes, adjustment_bytes, note, created_at]
                      properties:
                        id: { type: integer }
                        cycle_start: { type: string, format: date }
                        measured_bytes: { type: integer, description: 校准时的统计值（已乘系数） }
                        reported_bytes: { type: integer, description: 用户填写值 }
                        adjustment_bytes: { type: integer }
                        raw_rx: { type: integer, description: 校准时本周期的原始接收字节（未乘系数）；旧记录省略 }
                        raw_tx: { type: integer, description: 校准时本周期的原始发送字节（未乘系数）；旧记录省略 }
                        note: { type: string }
                        created_at: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vpsmon_session
      description: |
        Web 管理员会话 Cookie（设计 8.2、17.4）。修改类请求（非 GET / HEAD）还必须带 X-CSRF-Token 头，
        值来自登录或 /auth/me 响应中的 csrf_token，否则 403。
    apiKey:
      type: http
      scheme: bearer
      description: |
        只读 API Key（api_…，设计 45.2）：Web“账号 → API Key”中创建，只显示一次。只能访问标注了 apiKey 的读取类接口；
        可限定节点范围（范围外的节点按不存在处理，返回 404）；每个 Key 每分钟 120 次。只接受 Authorization 头。
    deviceToken:
      type: http
      scheme: bearer
      description: |
        App 设备 Access Token（dev_…，设计 12.5）：AK 配对获得，30 分钟有效，用 Refresh Token（rt_…）轮换。
        只能访问标注了 deviceToken 的接口：读取授权范围内的节点、指标、流量、告警，以及（AK 允许时）静音与维护；
        范围外的节点按不存在处理（404）。过期返回 401 token_expired（应刷新），设备被吊销返回 401 token_revoked（应重新配对）。
        每台设备每分钟 120 次。
    agentToken:
      type: http
      scheme: bearer
      description: Agent Token（agt_…），只能为 Token 绑定的节点上报（设计 23.2）

  parameters:
    ServerID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    ErrorBody:
      description: 统一错误响应（设计 43.4）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    RateLimited:
      description: 请求过于频繁
      headers:
        Retry-After: { schema: { type: integer }, description: 建议等待的秒数 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorCode:
      type: string
      description: 稳定的错误码，一经发布不再改名（设计 43.4）
      enum: [validation_failed, bad_request, unauthorized, token_revoked, forbidden, not_found, conflict,
             payload_too_large, enroll_code_invalid, rate_limited, quota_exceeded, unavailable, internal,
             password_change_required, reauth_required, captcha_failed, unsupported_encoding,
             access_key_invalid, token_expired]

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 中文提示，可直接展示给用户 }
            request_id: { type: string, example: r_8f2c1a3b4d5e }
            details:
              type: array
              description: 字段级错误，仅 validation_failed 使用
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }

    Me:
      type: object
      required: [username, role, must_change_password, csrf_token, totp_enabled, recovery_codes_left, alerts_enabled]
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, viewer], description: viewer 为只读的查看者（修订第 161 条） }
        must_change_password: { type: boolean, description: 使用初始 / 重置密码登录，需先修改密码 }
        csrf_token: { type: string, description: 修改类请求放在 X-CSRF-Token 头中 }
        totp_enabled: { type: boolean, description: 是否已开启两步验证（修订第 160 条） }
        recovery_codes_left: { type: integer, description: 未使用的恢复码数量；未开启时为 0 }
        alerts_enabled: { type: boolean, description: '告警总开关（修订第 175 条）：关闭时面板不评估告警、不发送通知，Web 隐藏告警分组；在面板主机上用 vpsmon-server admin alerts on|off 切换' }

    SystemEvent:
      type: object
      required: [id, kind, severity, server_id, server_name, title, message, created_at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [upgrade, reminder, panel, change], description: 'upgrade：Agent 升级结果；reminder：节点 / 证书 / 云账户到期等提醒；panel：面板自身告警与自检；change：节点配置变更（防火墙等，修订第 273 条）' }
        severity: { type: string, enum: [critical, warning, info] }
        server_id: { type: integer, description: 0 表示不属于某个节点 }
        server_name: { type: string, description: 节点已删除或不属于节点时为空 }
        title: { type: string, description: 一行摘要，与通知标题相同 }
        message: { type: string, description: 说明，可为空；change 的细节（每项变化一行）只返回给 Web 管理员，其他调用方为空 }
        created_at: { type: integer }

    SiteSetting:
      type: object
      required: [app_name, language, captcha]
      properties:
        app_name: { type: string, minLength: 1, maxLength: 32, description: 顶栏、登录页与浏览器标签中显示的名称；默认 VPS Monitor }
        language: { type: string, enum: [zh, en], description: 界面语言：zh 简体中文（默认）、en English }
        captcha: { type: boolean, description: 登录时是否需要滑动验证码（默认打开） }

    SiteView:
      allOf:
        - $ref: '#/components/schemas/SiteSetting'
        - type: object
          required: [captcha_forced_off]
          properties:
            captcha_forced_off: { type: boolean, description: 启动参数 --no-login-captcha 关闭了验证码，网页中不能打开 }

    ListenSettingInput:
      type: object
      required: [web, agent, agent_url]
      properties:
        web: { type: string, description: 'Web 监听地址（host:port，或只写端口）；反向代理模式只写端口时为 127.0.0.1:端口' }
        agent: { type: string, description: 'Agent 专用监听地址；空表示不单独监听（Agent 走 Web 端口）' }
        agent_url: { type: string, description: 'Agent 连接的对外地址（https://…），写进安装命令；单独监听 Agent 时必填（内置 HTTPS 模式可空，默认为 https://域名:端口）' }

    ListenSetting:
      type: object
      required: [mode, web, web_default, old_web, agent, agent_url, effective_agent_url]
      properties:
        mode: { type: string, enum: [proxy, https], description: 'proxy：面板在反向代理后面（只监听本机）；https：内置 HTTPS（--domain）' }
        web: { type: string, description: 当前的 Web 监听地址 }
        web_default: { type: string, description: 启动参数中的 Web 监听地址（--listen / --https-listen）；面板设置清除后回到它 }
        old_web: { type: string, description: 修改前、仍在监听的旧 Web 地址；空表示没有 }
        agent: { type: string, description: Agent 专用监听地址；空表示 Agent 走 Web 端口 }
        agent_url: { type: string }
        effective_agent_url: { type: string, description: 安装命令中实际使用的 Agent 地址；空表示与面板地址相同 }

    IPInfoSetting:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, description: 用 ipinfo.io 查询节点的 ASN 与位置；默认关闭 }

    IPInfo:
      type: object
      required: [ip, asn, org, hostname, city, region, country, timezone, fetched_at, error]
      properties:
        ip: { type: string, description: 查询的公网地址 }
        asn: { type: string, description: '如 AS13335；没有时为空' }
        org: { type: string, description: '运营方名称，如 Cloudflare, Inc.' }
        hostname: { type: string }
        city: { type: string }
        region: { type: string }
        country: { type: string, description: 两位国家 / 地区代码 }
        timezone: { type: string }
        fetched_at: { type: integer, description: 最近一次查询时间（Unix 秒） }
        error: { type: string, description: 最近一次查询失败的原因；成功时为空 }

    UnlockView:
      type: object
      required: [supported, pending, requested_at, checked_at, items]
      properties:
        supported: { type: boolean, description: 节点的 Agent 支持检测（最近一次上报声明；旧版 Agent 不支持） }
        pending: { type: boolean, description: 已请求、等待结果（10 分钟没有结果视为超时） }
        requested_at: { type: integer, description: 最近一次请求时间；0 表示从未检测 }
        checked_at: { type: integer, description: 最近一次结果的时间；0 表示还没有结果 }
        items:
          type: array
          items:
            type: object
            required: [service, status]
            properties:
              service: { type: string, description: '检测项键，如 netflix、yahoo、abema（当地服务的键见设计 50.2；面板显示未知的键时用键名）' }
              status: { type: string, enum: ['yes', 'no', partial, captcha, failed], description: 可用 / 不可用 / 部分可用（如 Netflix 仅自制剧）/ 要求人机验证 / 检测失败 }
              region: { type: string, description: 服务认定的地区（两位代码）或货币（Steam） }
              note: { type: string }
              local: { type: string, description: '当地服务所属的国家或地区（两位代码，修订第 196 条）：Agent 按本机所在地区追加的检测项；通用检测项没有这个字段' }

    PortExposure:
      type: object
      description: 最近一次“检测公网可达”的结果（修订第 171 条，只在内存中，面板重启后清空）；只在管理员的节点详情中返回，没有检测过时省略
      required: [checked_at, target, results]
      properties:
        checked_at: { type: integer }
        target: { type: string, description: 检测的地址（节点的公网 IP） }
        results:
          type: array
          items:
            type: object
            required: [port, proto, state]
            properties:
              port: { type: integer }
              proto: { type: string, enum: [tcp, udp] }
              state: { type: string, enum: [open, refused, timeout, error, skipped], description: 'open 可达；refused 被拒绝；timeout 超时（多为防火墙或安全组丢弃）；error 其他错误；skipped 不检测（UDP）' }
              ms: { type: integer, description: 建立连接用时（毫秒），open 时有 }

    UserView:
      type: object
      required: [id, username, role, must_change_password, totp_enabled, created_at, last_login_at]
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        must_change_password: { type: boolean, description: 尚未修改初始 / 重置的密码 }
        totp_enabled: { type: boolean }
        created_at: { type: integer }
        last_login_at: { type: integer, description: 0 表示从未登录 }

    UserCreated:
      type: object
      required: [user, password]
      properties:
        user: { $ref: '#/components/schemas/UserView' }
        password: { type: string, description: 初始密码，只显示这一次 }

    TotpChallenge:
      type: object
      required: [totp_required, challenge]
      properties:
        totp_required: { type: boolean, enum: [true] }
        challenge: { type: string, description: 提交验证码时带上；5 分钟内有效 }

    TotpSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 密钥，供无法扫码时手动输入 }
        otpauth_uri: { type: string, description: 'otpauth://totp/…，生成二维码给认证器 App 扫描' }

    EnrollTTL:
      type: string
      enum: ['1h', '24h', '7d']
      default: 24h
      description: 注册码有效期（设计 27.2）

    EnrollRequest:
      type: object
      description: 未知字段会被忽略，保证新版 Agent 与旧面板兼容
      required: [enroll_code]
      properties:
        enroll_code: { type: string, pattern: '^ENR-[0-9A-Z]{4}(-[0-9A-Z]{4}){3}$', description: 大小写不敏感 }
        hostname: { type: string }
        machine_id_hash: { type: string, example: 'sha256:…', description: sha256(/etc/machine-id)，用于重试幂等与识别更换主机 }
        os: { type: string, example: ubuntu }
        os_version: { type: string, example: '24.04' }
        arch: { type: string, example: amd64 }
        agent_version: { type: string }
        server_id: { type: integer, description: 可选：更换 Token（rotate-token）时本机当前所属的节点；注册码属于其他节点时返回 403 且不做任何修改（设计 17.2） }

    EnrollResponse:
      type: object
      required: [server_id, server_name, agent_token, warnings]
      properties:
        server_id: { type: integer }
        server_name: { type: string }
        agent_token: { type: string, description: 'agt_…，写入 /etc/vpsmon-agent/token 后不再传输' }
        warnings:
          type: array
          items: { type: string }
          description: 主机名 / IP 与填写值不一致时的提示（设计 27.6.3）

    CreateServerRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        expected_hostname: { type: string, description: 注册时核对 }
        expected_ipv4: { type: string, format: ipv4 }
        expected_ipv6: { type: string, format: ipv6 }
        group: { type: string, maxLength: 32 }
        note: { type: string, maxLength: 500 }
        provider: { type: string, maxLength: 64 }
        plan: { type: string, maxLength: 64 }
        region: { type: string, maxLength: 64 }
        country: { type: string, pattern: '^[A-Za-z]{2}$', description: 'ISO 3166-1 两位代码（大小写不敏感，保存为大写）；用于显示国旗' }
        bandwidth_mbps: { type: integer, minimum: 0, maximum: 1000000, description: 服务商标称带宽（端口速率），Mbps；0 或省略表示未填（设计 27.2） }
        report_interval_s: { type: integer, enum: [0, 5, 10, 15, 30, 60], description: 采样间隔秒数；0 或省略表示默认 10 秒（设计 4.2、6.1） }
        watch_procs:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._+:@-]+$' }
          description: 关注的进程名（与 /proc/PID/comm 比较，超过 15 个字符时比较前 15 个），Agent 统计是否在运行（设计 33.5.1）；修改节点时省略表示不变
        traffic_timezone: { type: string, example: America/Los_Angeles, description: '计费时区（IANA 名称）；空或省略表示面板时区。只影响之后写入的流量（设计 5.4）' }
        traffic_limit_gb: { type: number, minimum: 0, description: 按 traffic_unit 口径的 GB / GiB（设计 5.8），0 或省略表示不限 }
        traffic_unit: { type: string, enum: [decimal, binary], default: decimal, description: 'decimal：1 GB = 10^9 字节；binary：1 GiB = 2^30 字节（设计 5.8）' }
        traffic_factor: { type: number, minimum: 0.5, maximum: 2, default: 1, description: 统计系数，修正固定比例偏差（设计 5.7） }
        traffic_reset_day: { type: integer, minimum: 1, maximum: 31, default: 1 }
        traffic_count_mode: { type: string, enum: [sum, rx, tx, max], default: sum, description: 设计 1.2.4 }
        price: { type: number, minimum: 0, description: 续费价格，保留两位小数 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$', description: ISO 4217；填写价格时必填 }
        billing_period:
          type: string
          enum: ['', monthly, quarterly, semiannually, annually, biennially, triennially, one_time]
        expire_date: { type: string, format: date, description: YYYY-MM-DD }
        enroll_ttl: { $ref: '#/components/schemas/EnrollTTL' }
        verify_mode: { type: string, enum: [warn, strict], default: warn, description: 核对严格程度（设计 27.6.3） }

    InstallCommand:
      type: object
      required: [mode, command, server, manual_command, rotate_command, release]
      properties:
        mode:
          type: string
          enum: [default, manual]
          description: 面板尚未同步并验签任何官方版本时只有 manual（设计 27.3.1）
        command: { type: string, description: 'default：下载按版本固定的脚本 → 按已验签清单中的 SHA256 校验 → 执行；不使用管道（设计 27.3.1）' }
        manual_command: { type: string, description: 程序已在主机上时的注册命令（设计 27.3.3），两种模式都提供 }
        rotate_command: { type: string, description: 主机上已安装 Agent（如 Token 已吊销）时，凭新注册码就地更换 Token（设计 17.2） }
        server: { type: string, description: 写进命令的面板对外地址 }
        release:
          oneOf: [{ $ref: '#/components/schemas/AgentRelease' }, { type: 'null' }]
          description: 生成默认命令所用的已验签官方正式版

    AgentRelease:
      type: object
      description: 已同步并验签的官方 Agent 版本（设计 29.1）；每次读取都重新验签清单原文
      required: [version, channel, key_id, installer_file, installer_sha256, released_at, synced_at, mirrored]
      properties:
        version: { type: string }
        channel: { type: string, enum: [stable, beta] }
        key_id: { type: string, description: 签名所用官方公钥的 ID }
        installer_file: { type: string }
        installer_sha256: { type: string }
        released_at: { type: string }
        synced_at: { type: integer }
        notes: { type: string }
        artifacts: { type: array, items: { type: object, required: [file, size, sha256], properties: { os: { type: string }, arch: { type: string }, file: { type: string }, size: { type: integer }, sha256: { type: string } } } }
        mirrored: { type: boolean, description: 全部文件已校验并保存在本面板（设计 27.5.3） }

    QuietHours:
      type: object
      required: [enabled, start, end, critical, timezone]
      properties:
        enabled: { type: boolean }
        start: { type: string, example: '23:00', description: 'HH:MM；晚于 end 表示跨午夜' }
        end: { type: string, example: '08:00' }
        timezone: { type: string, example: Asia/Shanghai, description: IANA 时区名；空为面板本地时区 }
        critical: { type: string, enum: [notify, summary] }

    QuietHoursView:
      allOf:
        - { $ref: '#/components/schemas/QuietHours' }
        - type: object
          required: [active, effective_timezone, held]
          properties:
            active: { type: boolean, description: 当前是否处于免打扰 }
            effective_timezone: { type: string }
            held: { type: integer, description: 已暂存、等待汇总的通知数 }

    HeartbeatInput:
      type: object
      required: [enabled, interval]
      properties:
        enabled: { type: boolean }
        url: { type: string, description: '外部服务给的地址（如 Healthchecks.io、Uptime Kuma 推送监控）；留空保留原地址' }
        interval: { type: integer, minimum: 60, maximum: 3600, description: 发送间隔（秒），默认 300 }

    HeartbeatView:
      type: object
      required: [enabled, url, url_set, interval, last_at, last_ok, last_status, last_error]
      properties:
        enabled: { type: boolean }
        url: { type: string, description: 脱敏：只保留协议与主机（地址中常含令牌） }
        url_set: { type: boolean }
        interval: { type: integer }
        last_at: { type: integer, description: 最近一次发送时间（Unix 秒）；0 表示面板启动后还没有发送 }
        last_ok: { type: boolean, description: 最近一次是否收到 2xx }
        last_status: { type: integer, description: 最近一次的 HTTP 状态码；网络错误为 0 }
        last_error: { type: string, description: 失败原因（中文）；成功时为空 }

    NotifyChannel:
      type: object
      description: 通知渠道。凭证脱敏：bot_token 只保留 ID 与末 4 位，Webhook 地址只保留协议与主机，签名密钥与 ntfy 访问令牌只返回是否已设置，ntfy 主题只保留前 3 个字符
      required: [id, type, name, enabled, min_severity, notify_resolved, config, created_at, updated_at]
      properties:
        id: { type: integer }
        type: { type: string, enum: [telegram, webhook, ntfy, email, discord, bark, wecom, dingtalk, feishu] }
        name: { type: string }
        enabled: { type: boolean }
        min_severity: { type: string, enum: [critical, warning, info], description: 达到该级别才发送 }
        notify_resolved: { type: boolean }
        config:
          type: object
          properties:
            bot_token: { type: string, example: '123456789:AA…sawQ' }
            chat_id: { type: string }
            url: { type: string, example: 'https://hooks.example.com/…' }
            has_secret: { type: boolean }
            topic: { type: string, example: 'vps…', description: ntfy 主题（脱敏） }
            has_token: { type: boolean }
            smtp_host: { type: string }
            smtp_port: { type: integer }
            smtp_security: { type: string, enum: [tls, starttls, none] }
            username: { type: string }
            has_password: { type: boolean }
            from: { type: string }
            to: { type: string }
        created_at: { type: integer }
        updated_at: { type: integer }

    NotifyChannelInput:
      type: object
      required: [name, config]
      properties:
        type: { type: string, enum: [telegram, webhook, ntfy, email, discord, bark, wecom, dingtalk, feishu], description: '创建时必填，不可修改。discord / wecom（企业微信）/ dingtalk（钉钉）/ feishu（飞书）填机器人地址 url，钉钉与飞书可选加签 secret；bark 填服务器 url（默认 https://api.day.app）与设备密钥 token' }
        name: { type: string, maxLength: 40 }
        enabled: { type: boolean, default: true }
        min_severity: { type: string, enum: [critical, warning, info], default: warning }
        notify_resolved: { type: boolean, default: true }
        config:
          type: object
          description: 修改时凭证字段留空表示保持原值
          properties:
            bot_token: { type: string, description: Telegram Bot Token（@BotFather） }
            chat_id: { type: string, description: 数字 ID（群组为负数）或 @频道名 }
            url: { type: string, description: Webhook 地址，或 ntfy 服务器地址（默认 https://ntfy.sh）；只允许 HTTPS，回环地址除外；不跟随重定向 }
            secret: { type: string, maxLength: 128, description: '可选。Webhook：请求头 X-Vpsmon-Signature 为 sha256=HMAC-SHA256(secret, 请求体)；钉钉、飞书：机器人的加签密钥' }
            clear_secret: { type: boolean }
            topic: { type: string, maxLength: 64, description: ntfy 主题；公共服务器上知道主题即可订阅，请用不易猜到的名称 }
            token: { type: string, maxLength: 128, description: ntfy 可选访问令牌（tk_…，Authorization Bearer）；Bark 的设备密钥（Device Key） }
            clear_token: { type: boolean }
            smtp_host: { type: string, description: 邮件：SMTP 服务器，如 smtp.gmail.com }
            smtp_port: { type: integer, description: 邮件：端口，默认按加密方式 465 / 587 }
            smtp_security: { type: string, enum: [tls, starttls, none], description: '邮件：tls（隐式 TLS，465）/ starttls（587，默认）/ none（只允许本机回环地址）；始终校验证书' }
            username: { type: string, maxLength: 128, description: 邮件：SMTP 用户名 }
            password: { type: string, maxLength: 256, description: 邮件：SMTP 密码或授权码；修改时留空保持原值，但改了服务器或用户名必须重填 }
            from: { type: string, description: '邮件：发件人，如 VPS Monitor <alerts@example.com>' }
            to: { type: string, description: 邮件：收件人，逗号分隔，最多 10 个 }

    Delivery:
      type: object
      required: [id, channel_id, channel_name, channel_type, event_id, server_name, kind, title, status, attempts, last_error, created_at, sent_at]
      properties:
        id: { type: integer }
        channel_id: { type: integer, description: App 推送（channel_type 为 app）时为 0 }
        channel_name: { type: string }
        channel_type: { type: string, enum: [telegram, webhook, ntfy, email, discord, bark, wecom, dingtalk, feishu, app], description: app 为 App 原生推送（设计 30），channel_name 为“App：设备名” }
        event_id: { type: integer, description: 测试通知为 0 }
        server_name: { type: string }
        kind: { type: string, enum: [firing, resolved, repeat, test, flapping, still_firing, panel_down, panel_up, panel_issue, panel_issue_resolved, quiet_summary, reminder], description: 'panel_issue / panel_issue_resolved：面板自身告警 / 恢复——后台任务反复崩溃、磁盘空间不足、写库失败、推送失败（设计 16.1）；reminder：到期 / 云账户提醒（设计 1.2.5、44.6）；quiet_summary：免打扰结束后的汇总；flapping：状态频繁变化（之后暂停该告警的通知）；still_firing：抖动结束时仍在告警；panel_down / panel_up：面板自检（设计 16.4）' }
        title: { type: string }
        status: { type: string, enum: [sent, failed, retrying] }
        attempts: { type: integer }
        last_error: { type: string, description: 不含请求地址与凭证 }
        created_at: { type: integer }
        sent_at: { type: integer }

    UpgradeTask:
      type: object
      description: 远程升级任务（设计 29.10、29.13）
      required: [id, server_id, server_name, target_version, from_version, status, reason, created_by, created_at, updated_at, rollout_id, stage]
      properties:
        id: { type: integer }
        server_id: { type: integer }
        server_name: { type: string }
        target_version: { type: string }
        from_version: { type: string, description: 创建任务时节点上报的版本 }
        status: { type: string, enum: [pending, delivered, staged, success, failed, rolled_back, cancelled] }
        reason: { type: string, description: 失败或回滚原因 }
        created_by: { type: string }
        created_at: { type: integer }
        updated_at: { type: integer }
        rollout_id: { type: integer, description: 所属灰度升级；0 表示单独创建的任务 }
        stage: { type: integer, description: 灰度升级中的批次（从 1 开始）；单独创建的任务为 0 }

    RolloutStage:
      type: object
      description: 灰度升级的一批，累计规模二选一：count 台，或 percent（占全部参与节点的百分比，向上取整）
      properties:
        count: { type: integer, minimum: 1 }
        percent: { type: integer, minimum: 1, maximum: 100 }

    UpgradeRollout:
      type: object
      description: 灰度升级（设计 29.16）
      required: [id, target_version, status, stages, observe_minutes, max_failures, total, current_stage, stage_done_at, reason, skipped, progress, created_by, created_at, updated_at]
      properties:
        id: { type: integer }
        target_version: { type: string }
        status: { type: string, enum: [running, paused, completed, cancelled], description: paused 包括手动暂停与自动暂停（见 reason） }
        stages: { type: array, items: { $ref: '#/components/schemas/RolloutStage' } }
        observe_minutes: { type: integer }
        max_failures: { type: integer }
        total: { type: integer, description: 参与的节点数 }
        current_stage: { type: integer, description: 当前批次（从 1 开始） }
        stage_done_at: { type: integer, description: 当前批全部结束的时间；0 表示还有任务在进行，观察期从这时开始 }
        reason: { type: string, description: 暂停、取消或完成的说明 }
        skipped: { type: array, items: { type: object, required: [server_id, reason], properties: { server_id: { type: integer }, reason: { type: string } } } }
        progress:
          type: array
          description: 每批的任务统计
          items:
            type: object
            required: [stage, target, tasks, success, failed, active]
            properties:
              stage: { type: integer }
              target: { type: integer, description: 本批计划的台数 }
              tasks: { type: integer }
              success: { type: integer }
              failed: { type: integer, description: 失败与回滚 }
              active: { type: integer }
        created_by: { type: string }
        created_at: { type: integer }
        updated_at: { type: integer }

    EnrollCodeView:
      type: object
      required: [server_id, server_name, enroll_state, enroll_code_hint, enroll_status, enroll_expires_at, install]
      properties:
        server_id: { type: integer }
        server_name: { type: string }
        enroll_state: { type: string, enum: [pending, enrolled] }
        enroll_code: { type: string, description: 完整注册码，只在新建与重新生成时返回 }
        enroll_code_hint: { type: string, example: 'ENR-7KQ2-****' }
        enroll_status: { type: string, enum: [ACTIVE, USED, REVOKED, EXPIRED, NONE] }
        enroll_expires_at: { type: integer, description: Unix 秒 }
        install: { $ref: '#/components/schemas/InstallCommand' }

    ServerView:
      type: object
      required: [id, name, status, enroll_state, expected_hostname, expected_ipv4, expected_ipv6, verify_mode, enrolled_at, created_at, hostname, ipv4, ipv6, group, note, provider, plan, region, country, bandwidth_mbps, report_interval_s, watch_procs, price_cents, currency, billing_period, expire_date, sort_order, traffic_limit_bytes, traffic_reset_day, traffic_timezone, traffic_count_mode, traffic_unit, traffic_factor, last_seen_at, alerts, traffic]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [online, unknown, offline, pending], description: '≤30 秒在线，≤120 秒未知（设计 22）；pending 为待安装（设计 27.7）' }
        last_seen_at: { type: integer }
        enroll_state: { type: string, enum: [pending, enrolled] }
        expected_hostname: { type: string }
        expected_ipv4: { type: string }
        expected_ipv6: { type: string }
        verify_mode: { type: string, enum: [warn, strict] }
        hostname: { type: string }
        ipv4: { type: string }
        ipv6: { type: string }
        enrolled_at: { type: integer }
        group: { type: string }
        note: { type: string }
        provider: { type: string }
        plan: { type: string }
        region: { type: string }
        country: { type: string, description: ISO 3166-1 两位代码（大写），空表示未填 }
        bandwidth_mbps: { type: integer, description: 标称带宽 Mbps，0 表示未填 }
        report_interval_s: { type: integer, description: 采样间隔秒数，0 表示默认 10 秒 }
        watch_procs: { type: array, items: { type: string }, description: 关注的进程名（设计 33.5.1） }
        traffic_timezone: { type: string, description: 计费时区（IANA），空表示面板时区 }
        price_cents: { type: integer, description: 续费价格 × 100 }
        currency: { type: string }
        billing_period: { type: string }
        expire_date: { type: string }
        sort_order: { type: integer, description: '自定义顺序（修订第 150 条）：从 1 开始，0 表示未排（排在已排的后面，按名称）' }
        traffic_limit_bytes: { type: integer }
        traffic_reset_day: { type: integer }
        traffic_count_mode: { type: string, enum: [sum, rx, tx, max] }
        created_at: { type: integer }
        latest: { $ref: '#/components/schemas/Report' }
        container_names:
          type: object
          additionalProperties: { type: string }
          description: 用户给容器起的名字（容器 ID 前 12 位 → 名称，修订第 164 条）；只在节点详情接口中返回，没有时省略
        container_restarts:
          type: object
          additionalProperties: { type: integer }
          description: 各容器 24 小时内的重启次数（容器 ID 前 12 位 → 次数，修订第 167 条）；只在节点详情接口中、有重启时返回
        port_exposure:
          $ref: '#/components/schemas/PortExposure'
        ip_info:
          $ref: '#/components/schemas/IPInfo'
          description: 节点公网 IP 的 ASN 与位置（设计 49，来自 ipinfo.io，需在设置中打开）；只在节点详情接口中、查询过时返回
        unlock:
          $ref: '#/components/schemas/UnlockView'
          description: 流媒体与网站解锁检测（设计 50）；只在节点详情接口中返回
        port_baseline:
          type: object
          description: |
            端口基线（修订第 170 条）：允许对公网开放的监听端口。未设置时省略（不评估“未知监听端口”与“基线端口未监听”）。
            只在管理员的节点详情中返回
          required: [ports, labels, updated_at]
          properties:
            ports: { type: array, items: { type: string }, description: '如 22/tcp、443/tcp、51820/udp' }
            labels: { type: object, additionalProperties: { type: string }, description: '修订第 258 条：端口备注，如 {"443/tcp": "Xray 入口"}；没有时为空对象' }
            updated_at: { type: integer }
        proxies_missing:
          type: array
          description: 曾经运行、现在没有运行的代理程序（修订第 169 条）；只在管理员的节点详情中返回，没有时省略
          items:
            type: object
            required: [name, since]
            properties:
              name: { type: string }
              since: { type: integer, description: 发现没有运行的时间（Unix 秒） }
        containers_missing:
          type: array
          description: |
            已停止的容器（修订第 166 条）：按主进程名统计，运行中的数量少于曾经运行的数量；“容器已停止”告警据此评估。
            只在节点详情接口中返回，没有时省略
          items:
            type: object
            required: [label, missing, since]
            properties:
              label: { type: string, description: 主进程名，如 nginx }
              missing: { type: integer, description: 少了几个 }
              since: { type: integer, description: 开始缺少的时间（Unix 秒） }
        traffic_unit: { type: string, enum: [decimal, binary] }
        traffic_factor: { type: number }
        traffic: { $ref: '#/components/schemas/TrafficView' }
        alerts:
          type: array
          description: 活动告警（firing），严重在前；同一类型只保留最严重的一条；节点离线时只有离线告警（设计 16.4）
          items:
            type: object
            required: [event_id, rule_key, type, severity, message, value, fired_at, silenced]
            properties:
              event_id: { type: integer }
              rule_key: { type: string }
              type: { type: string }
              severity: { type: string, enum: [info, warning, critical] }
              message: { type: string }
              value: { type: number, description: 当前值：百分比、离线秒数或负载倍数 }
              fired_at: { type: integer }
              silenced: { type: boolean, description: 已静音：照常记录，不通知，不计入需要关注 }
        maintenance: { $ref: '#/components/schemas/Silence' }
        muted: { $ref: '#/components/schemas/Silence' }

    Silence:
      type: object
      required: [id, scope_type, scope_id, kind, reason, starts_at, ends_at, created_by]
      properties:
        id: { type: integer }
        scope_type: { type: string, enum: [server, group, rule, global] }
        scope_id: { type: string }
        kind: { type: string, enum: [mute, maintenance] }
        reason: { type: string }
        starts_at: { type: integer }
        ends_at: { type: ['integer', 'null'], description: null 表示直到手动结束 }
        created_by: { type: string }

    AlertRule:
      type: object
      required: [id, rule_key, scope_type, scope_id, type, operator, threshold, recover_threshold, duration_s, recover_duration_s, severity, repeat_interval_s, enabled]
      properties:
        id: { type: integer }
        rule_key: { type: string, description: 同一规则在三层中的标识，下层按它覆盖上层 }
        scope_type: { type: string, enum: [global, group, server] }
        scope_id: { type: string }
        type: { type: string, enum: [offline, cpu, memory, disk, swap, load, traffic, traffic_forecast, agent_clock, process, probe_latency, probe_loss, reach, container, container_restart, proxy, port_new, port_gone] }
        operator: { type: string, enum: ['>', '>='] }
        threshold: { type: number }
        recover_threshold: { type: number, description: 低于此值恢复（回差） }
        duration_s: { type: integer }
        recover_duration_s: { type: integer }
        severity: { type: string, enum: [info, warning, critical] }
        repeat_interval_s: { type: integer }
        enabled: { type: boolean }

    AlertEvent:
      type: object
      required: [id, rule_key, server_id, server_name, type, severity, state, value, threshold, message, started_at, fired_at]
      properties:
        id: { type: integer }
        rule_id: { type: integer }
        rule_key: { type: string }
        server_id: { type: integer }
        server_name: { type: string }
        type: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        state: { type: string, enum: [firing, resolved] }
        value: { type: number, description: 触发时的值 }
        threshold: { type: number }
        message: { type: string }
        started_at: { type: integer, description: 开始满足条件（pending）的时间 }
        fired_at: { type: integer }
        resolved_at: { type: integer }
        resolved_value: { type: number }

    NodeProbe:
      type: object
      required: [mode, target_ids, interval_s]
      properties:
        mode: { type: string, enum: [default, custom, 'off'], description: 'default：跟随全局；custom：自定义；off：这台节点不测' }
        target_ids: { type: array, maxItems: 64, items: { type: integer }, description: custom 时这台节点要测的目标 ID；其他模式为空数组 }
        interval_s: { type: integer, enum: [0, 60, 120, 300, 600, 900, 1800], description: custom 时的测试频率（秒），0 表示跟随全局 }
        timeout_s: { type: integer, minimum: 0, maximum: 10, description: custom 时每个样本的超时（最大等待，秒），0 表示跟随全局（修订第 133 条）；省略为 0 }
        gap_s: { type: integer, minimum: 0, maximum: 10, description: custom 时的样本间隔（秒），0 表示跟随全局；省略为 0 }

    ProbeSettings:
      type: object
      required: [interval_s]
      properties:
        interval_s: { type: integer, enum: [60, 120, 300, 600, 900, 1800], description: 每轮间隔（秒），默认 300 }
        timeout_s: { type: integer, minimum: 0, maximum: 10, description: 每个样本的超时（最大等待，秒），0 表示默认 4 秒（修订第 133 条）；省略为 0 }
        gap_s: { type: integer, minimum: 0, maximum: 10, description: 样本间隔（秒），0 表示默认 1 秒；省略为 0 }

    ProbeTargetInput:
      type: object
      description: 添加时 isp、province、address 必填；修改时省略的字段保持不变（修订第 128 条）
      properties:
        isp: { type: string, enum: [ct, cu, cm, intl], description: 运营商：ct 电信、cu 联通、cm 移动、intl 境外（内置目标不可改） }
        province: { type: string, maxLength: 16, description: 地区，如 上海；境外为城市，如 东京（内置目标不可改） }
        address: { type: string, description: '公网 IPv4 / IPv6 或域名（修订第 132 条；域名由 Agent 每轮解析，只连接公网地址；粘贴的网址只保留域名）。内置目标不可改' }
        proto: { type: string, enum: [tcp, icmp], description: 默认 tcp }
        port: { type: integer, minimum: 1, maximum: 65535, description: tcp 端口，默认 80；icmp 时忽略 }
        enabled: { type: boolean }
        note: { type: string, maxLength: 64 }
        server_id: { type: integer, description: 只在添加时有效：添加为这台节点自己的目标（每台最多 20 个）；省略或 0 为共用目标 }

    ProbeTarget:
      type: object
      description: 三网延迟的探测目标（设计 42.3.2）
      required: [id, isp, province, address, proto, port, enabled, builtin, note, server_id]
      properties:
        id: { type: integer }
        isp: { type: string, enum: [ct, cu, cm, intl], description: 'intl：境外，province 为城市，note 为提供商' }
        province: { type: string }
        address: { type: string }
        proto: { type: string, enum: [tcp, icmp] }
        port: { type: integer, description: icmp 时为 0 }
        enabled: { type: boolean }
        builtin: { type: boolean, description: 内置目标（随版本发布）只能停用，不能删除 }
        note: { type: string }
        server_id: { type: integer, description: 0 表示所有节点共用；否则是这台节点自己的目标，只在它的自定义设置中使用（enabled 始终为 false） }
        health:
          type: object
          description: 只在列表中返回：全部节点最近 24 小时到这个目标的汇总（修订第 134 条）
          required: [state, nodes, rounds, loss, latency_ms, last_at]
          properties:
            state: { type: string, enum: [ok, degraded, dead, nodata], description: 'dead：至少 3 轮且平均丢包 ≥ 99%，疑似失效；degraded：丢包 ≥ 20%；nodata：还没有结果' }
            nodes: { type: integer, description: 测过它的节点数 }
            rounds: { type: integer, description: 结果条数（每个节点每轮一条） }
            loss: { type: ['number', 'null'], description: 平均丢包率；没有结果时为 null }
            latency_ms: { type: ['number', 'null'], description: 成功轮次的平均延迟；没有成功时为 null }
            last_at: { type: integer, description: 最近一轮的时间；没有时为 0 }

    ReachProbe:
      type: object
      required: [server_id, isp, ports, icmp]
      properties:
        server_id: { type: integer, description: 作为探针的节点（应位于国内） }
        isp: { type: string, enum: [ct, cu, cm, ''], description: 探针所在运营商；留空表示未标明 }
        ports: { type: array, maxItems: 3, items: { type: integer, minimum: 1, maximum: 65535 }, description: 'TCP 端口，如 [22, 443]' }
        icmp: { type: boolean, description: 是否 Ping }

    ReachProbes:
      type: object
      required: [items, next_cursor, max_checks]
      properties:
        next_cursor: { type: string }
        max_checks: { type: integer, description: 每台探针每轮最多的探测项（Agent 上限，含三网延迟目标） }
        items:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/ReachProbe' }
              - type: object
                required: [name, status, count]
                properties:
                  name: { type: string }
                  status: { type: string, enum: ['on', 'off', unsupported], description: 探针 Agent 的探测状态 }
                  count: { type: integer, description: 下发的探测项数 }

    ReachCheck:
      type: object
      required: [family, port, latency_ms, loss, error]
      properties:
        family: { type: integer, enum: [4, 6] }
        port: { type: integer, description: 0 为 Ping }
        latency_ms: { type: ['number', 'null'] }
        loss: { type: number }
        error: { type: string, description: 全部失败时的原因，如 timeout、refused；icmp_unavailable 表示探针没有 Ping 权限（不参与判定） }

    ServerReach:
      type: object
      required: [configured, status, text, probes, series]
      properties:
        configured: { type: boolean, description: 是否设置了国内探针 }
        status: { type: string, enum: ['', ok, unstable, port, partial, blocked, offline], description: 结论；还没有探测结果时为空 }
        text: { type: string, description: 如“国内可达”“国内不可达（疑似被墙）”“移动不可达”“端口 443 国内不可达”“国内线路不稳定” }
        probes:
          type: array
          items:
            type: object
            required: [probe_id, name, isp, status, since, bad_ports, last_at, checks]
            properties:
              probe_id: { type: integer }
              name: { type: string }
              isp: { type: string }
              status: { type: string, enum: [ok, unstable, port, blocked] }
              since: { type: integer, description: 进入当前状态的时间 }
              bad_ports: { type: array, items: { type: integer } }
              last_at: { type: integer, description: 最近一轮的时间 }
              checks: { type: ['array', 'null'], items: { $ref: '#/components/schemas/ReachCheck' } }
        series:
          type: object
          description: 探针 ID → 最近 24 小时每轮的延迟（IPv4 上第一个成功项，优先 Ping）与平均丢包
          additionalProperties:
            type: array
            items:
              type: object
              required: [ts, latency_ms, loss]
              properties:
                ts: { type: integer }
                latency_ms: { type: ['number', 'null'] }
                loss: { type: number }

    LatencyOverview:
      type: object
      required: [servers, targets, cells]
      properties:
        servers:
          type: array
          items:
            type: object
            required: [id, name, group]
            properties:
              id: { type: integer }
              name: { type: string }
              group: { type: string }
        targets: { type: array, items: { $ref: '#/components/schemas/ProbeTarget' } }
        cells:
          type: array
          description: 有结果的（节点, 目标）组合
          items:
            type: object
            required: [server_id, target_id, latency_ms, loss]
            properties:
              server_id: { type: integer }
              target_id: { type: integer }
              latency_ms: { type: ['number', 'null'], description: 最近 1 小时成功轮次的中位数；全部失败时为 null }
              loss: { type: number, description: 平均丢包率 0～100 }

    LatencyView:
      type: object
      required: [status, mode, interval_s, targets, series]
      properties:
        mode: { type: string, enum: [default, custom, 'off'], description: '节点的三网延迟设置（GET /servers/{id}/probe）' }
        interval_s: { type: integer, description: 这台节点实际的测试频率（秒） }
        status: { type: string, enum: ['on', 'off', unsupported], description: 'on：Agent 在探测；off：节点本机关闭了探测（no-probe 文件）；unsupported：旧版 Agent 或面板重启后尚未收到上报' }
        targets:
          type: array
          description: 这台节点在测的目标（enabled 为 true），以及范围内有数据、现在不测的目标（enabled 为 false）
          items:
            allOf:
              - { $ref: '#/components/schemas/ProbeTarget' }
              - type: object
                required: [latency_ms, loss, last_at, last_error]
                properties:
                  latency_ms: { type: ['number', 'null'], description: 最近 1 小时延迟中位数（毫秒）；没有成功的样本时为 null }
                  loss: { type: ['number', 'null'], description: 最近 1 小时平均丢包率 0～100；没有数据时为 null }
                  last_at: { type: integer, description: 最近一轮的时间；0 表示还没有数据 }
                  last_error: { type: string, description: '最近一轮全部失败时的原因：timeout、refused、unreachable、icmp_unavailable、dns（域名解析失败）、blocked（域名只解析到内网地址）、error' }
        series:
          type: object
          description: 键为目标 ID
          additionalProperties:
            type: array
            items:
              type: object
              required: [ts, latency_ms, loss]
              properties:
                ts: { type: integer }
                latency_ms: { type: ['number', 'null'] }
                loss: { type: number }

    ServiceMonitorInput:
      type: object
      required: [name, kind, target]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [http, tcp, dns, icmp] }
        target: { type: string, maxLength: 500, description: 'http：网址（https://example.com/health）；tcp：主机:端口（db.example.com:5432）；dns：域名；icmp：主机名或 IP' }
        server_id: { type: integer, description: 关联的节点（可选，0 表示不关联）；关联后只能查看该节点的 App 设备也会收到推送 }
        interval_s: { type: integer, minimum: 30, maximum: 3600, description: 检查间隔，默认 60 }
        timeout_s: { type: integer, minimum: 1, maximum: 30, description: 超时，默认 10 }
        fail_threshold: { type: integer, minimum: 1, maximum: 10, description: 连续失败几次判为异常，默认 2 }
        severity: { type: string, enum: [critical, warning], description: 默认 critical }
        expect_status: { type: string, maxLength: 64, description: 'http：期望的状态码，如 200、200-299、200,301；默认 200-399' }
        keyword: { type: string, maxLength: 100, description: http：响应内容（前 64 KB）必须包含的文字 }
        dns_type: { type: string, enum: [A, AAAA], description: dns：查询类型，默认 A }
        dns_expect: { type: string, maxLength: 64, description: dns：解析结果必须包含的 IP }
        enabled: { type: boolean, description: 默认 true }

    ServiceMonitor:
      type: object
      description: 服务监控（设计 33.2）
      required: [id, name, kind, target, server_id, interval_s, timeout_s, fail_threshold, severity, expect_status, keyword, dns_type, dns_expect,
        enabled, status, status_since, fails, last_latency_ms, last_error, checked_at, uptime_24h, uptime_7d, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [http, tcp, dns, icmp] }
        target: { type: string }
        server_id: { type: integer }
        interval_s: { type: integer }
        timeout_s: { type: integer }
        fail_threshold: { type: integer }
        severity: { type: string, enum: [critical, warning] }
        expect_status: { type: string }
        keyword: { type: string }
        dns_type: { type: string }
        dns_expect: { type: string }
        enabled: { type: boolean }
        status: { type: string, enum: [up, down, unknown], description: unknown 表示还没有检查或刚开始失败、尚未达到连续失败次数 }
        status_since: { type: integer, description: 进入当前状态的时间 }
        fails: { type: integer, description: 当前连续失败次数 }
        last_latency_ms: { type: ['integer', 'null'], description: 最近一次成功检查的耗时；最近一次失败时为 null }
        last_error: { type: string }
        checked_at: { type: integer }
        uptime_24h: { type: ['number', 'null'], description: 最近 24 小时成功率（0～100）；没有记录时为 null }
        uptime_7d: { type: ['number', 'null'] }
        created_at: { type: integer }

    SubscriptionInput:
      type: object
      required: [name, category, price_cents, currency, cycle, start_date, country, payment]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        brand: { type: string, maxLength: 32, description: 常用服务目录中的键（决定图标颜色与首字母），自定义时为空 }
        category: { type: string, enum: [video, tools, reading, social, health, game, cloud, sim, vps, other], description: 影音娱乐 / 效率&工具 / 阅读&学习 / 社交 / 健康&运动 / 游戏 / 云与开发 / SIM 电话卡 / VPS / 其他 }
        price_cents: { type: integer, minimum: 0, maximum: 100000000, description: 每期价格（分） }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: 如 CNY、USD }
        country: { type: string, pattern: '^[A-Z]{2}$', description: 订阅的国家 / 地区（ISO 3166-1 两位代码，修订第 223 条） }
        payment: { type: string, enum: [alipay, wechat, bank, credit, paypal, apple, google, carrier, crypto, other], description: 支付方式：支付宝 / 微信支付 / 银行卡 / 信用卡 / PayPal / Apple 账户 / Google Play / 运营商代扣 / 加密货币 / 其他 }
        cycle: { type: string, enum: [weekly, monthly, quarterly, semiannually, annually, once], description: 扣费周期；once 为一次性 }
        trial_days: { type: integer, minimum: 0, maximum: 366, description: 免费试用天数，0 为没有试用；首次扣费在开始日期加试用天数 }
        start_date: { type: string, format: date, description: 开始订阅的日期（YYYY-MM-DD） }
        end_date: { type: string, description: '结束订阅的日期（YYYY-MM-DD），空表示仍在订阅；这一天及之后不再扣费' }
        remind_days: { type: integer, enum: [0, 1, 2, 3, 7], description: '扣费前几天提醒；0 为不提醒（经通知渠道发送，告警关闭时不发送）' }
        note: { type: string, maxLength: 200 }
        phones:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/SubscriptionPhone' }
          description: SIM 电话卡的号码（最多 10 个，空行忽略）；其他类别通常为空
        vps: { $ref: '#/components/schemas/SubscriptionVPS' }

    SubscriptionVPS:
      type: object
      description: VPS 的地址与配置（类别为 vps 时，修订第 198 条）；其他类别忽略。数值为 0 表示没有填写
      required: [ips, cpu, memory_gb, disk_gb, bandwidth_mbps, traffic_gb, location]
      properties:
        ips: { type: array, maxItems: 16, items: { type: string }, description: 'IPv4 / IPv6 地址（最多 16 个，空行忽略）' }
        cpu: { type: integer, minimum: 0, maximum: 1024, description: CPU 核数 }
        memory_gb: { type: number, minimum: 0, maximum: 16384, description: 内存（GB，可为小数，如 0.5） }
        disk_gb: { type: integer, minimum: 0, maximum: 1000000, description: 硬盘（GB） }
        bandwidth_mbps: { type: integer, minimum: 0, maximum: 1000000, description: 带宽（Mbps） }
        traffic_gb: { type: integer, minimum: 0, maximum: 100000000, description: 每月流量（GB）；0 为没有填写 }
        location: { type: string, maxLength: 40, description: 机房 / 地区，如 东京、Los Angeles }

    SubscriptionPhone:
      type: object
      required: [cc, number]
      properties:
        cc: { type: string, pattern: '^[+][0-9]{1,4}$', description: 国家 / 地区区号，如 +1、+86、+852 }
        number: { type: string, description: '号码（只保留数字，4～15 位）' }

    Subscription:
      type: object
      required: [id, name, brand, category, price_cents, currency, cycle, trial_days, start_date, end_date, remind_days, note,
                 phones, vps, next_charge, ended, logo_version, created_at, updated_at, country, payment]
      properties:
        id: { type: integer }
        name: { type: string }
        brand: { type: string, description: 常用服务目录中的键；自定义时为空 }
        category: { type: string, enum: [video, tools, reading, social, health, game, cloud, sim, vps, other] }
        price_cents: { type: integer, description: 每期价格（分） }
        currency: { type: string }
        cycle: { type: string, enum: [weekly, monthly, quarterly, semiannually, annually, once] }
        trial_days: { type: integer }
        start_date: { type: string, description: YYYY-MM-DD }
        end_date: { type: string, description: YYYY-MM-DD；空表示仍在订阅 }
        remind_days: { type: integer }
        note: { type: string }
        country: { type: string, description: 订阅的国家 / 地区（两位代码）；修订第 223 条之前添加、尚未编辑的为空 }
        payment: { type: string, description: 支付方式（见 SubscriptionInput.payment）；尚未设置时为空 }
        phones: { type: array, items: { $ref: '#/components/schemas/SubscriptionPhone' } }
        vps: { $ref: '#/components/schemas/SubscriptionVPS' }
        next_charge: { type: string, description: '下次扣费日期（YYYY-MM-DD，面板本地时区，可能是今天）；已结束或一次性已扣过时为空' }
        ended: { type: boolean, description: 已过结束日期 }
        logo_version: { type: integer, description: '上传的图标的版本（上传时间，Unix 秒）；0 表示没有上传，使用内置标志或首字母。图标地址为 /subscriptions/{id}/logo?v=logo_version' }
        created_at: { type: integer }
        updated_at: { type: integer }

    SSLMonitor:
      type: object
      required: [id, host, port, note, not_before, not_after, issuer, subject, sans, valid, last_error, checked_at, created_at]
      properties:
        id: { type: integer }
        host: { type: string }
        port: { type: integer }
        note: { type: string }
        not_before: { type: integer }
        not_after: { type: integer, description: 证书到期时间，Unix 秒；0 表示还没有读到证书 }
        issuer: { type: string }
        subject: { type: string }
        sans: { type: array, items: { type: string }, description: 证书中的域名（最多 20 个） }
        valid: { type: boolean, description: 证书链、域名与有效期都通过校验 }
        last_error: { type: string, description: 无法连接或校验失败的原因；暂时连不上时保留上次读到的证书信息 }
        checked_at: { type: integer }
        created_at: { type: integer }

    HealthSummary:
      type: object
      required: [level, status, items]
      properties:
        level: { type: string, enum: [ok, warn, bad, muted], description: 'muted：待安装或维护中' }
        status: { type: string, description: '总体结论，如“正常”“需要关注：CPU 96%”“离线 4 分钟”' }
        items:
          type: array
          description: 按 CPU、内存、磁盘、流量的顺序；没有数据的项省略
          items:
            type: object
            required: [key, title, text, level]
            properties:
              key: { type: string, enum: [cpu, memory, disk, traffic] }
              title: { type: string }
              text: { type: string, description: '如“过去 24 小时平均 12%，峰值 68%”' }
              level: { type: string, enum: [ok, warn, bad] }

    TrafficView:
      type: object
      description: 本计费周期流量（设计 5.7、5.8、32）。字节数均为整数，GB 换算由客户端按 unit 完成。
      required: [cycle_start, cycle_end, rx, tx, measured, adjustment, used, limit, unit, factor]
      properties:
        cycle_start: { type: string, format: date }
        cycle_end: { type: string, format: date, description: 下一周期开始日（不含） }
        rx: { type: integer }
        tx: { type: integer }
        measured: { type: integer, description: 统计值：按计费模式取值 × 系数，不含校准 }
        adjustment: { type: integer, description: 本周期最近一次校准在当前系数与计费模式下的偏差，可为负（设计 5.7） }
        calibrated_at: { type: integer, description: 最近一次校准时间，Unix 秒；未校准时省略 }
        used: { type: integer, description: 展示值 = 统计值 + 校准偏差 }
        limit: { type: integer, description: 字节，0 表示不限 }
        unit: { type: string, enum: [decimal, binary] }
        factor: { type: number }
        forecast:
          type: object
          description: 周期结束时的预计用量；周期开始不足 3 天时省略（设计 32）
          required: [daily, total, over]
          properties:
            daily: { type: integer, description: 采用的日均 }
            total: { type: integer }
            over: { type: boolean, description: 预计超过额度 }
        factor_suggestion: { type: number, description: 多次校准显示稳定的比例偏差时建议设置的统计系数；没有建议时省略（设计 5.7） }

    Report:
      type: object
      description: Agent 上报，定义见 internal/protocol（设计 6.2）；只做向后兼容的新增
      required: [timestamp, agent_version, system, cpu, memory, swap, disk, network]
      properties:
        timestamp: { type: integer }
        agent_version: { type: string }
        final: { type: boolean }
        sent_at: { type: integer, description: 可选：发送时刻的 Agent 时钟（Unix 秒），面板据此计算时钟偏差（设计 43.5） }
        unchanged:
          type: array
          items: { type: string, enum: [ports, firewall, proxies] }
          description: >-
            可选（修订第 271 条）：与上一份被面板接受的上报相同、因而省略的字段。只在面板以响应头 X-Report-Features: unchanged
            声明支持后使用；面板用实时状态补全，没有上一份时返回 409（conflict），Agent 改发完整上报（设计 6.1）
        system:
          type: object
          required: [hostname, os, os_version, kernel, arch, uptime]
          properties:
            hostname: { type: string }
            os: { type: string }
            os_version: { type: string }
            kernel: { type: string }
            arch: { type: string }
            uptime: { type: integer, description: 秒 }
            boot_id: { type: string }
            cpu_model: { type: string, description: 可选（设计 4.4） }
            counter_bits: { type: integer, enum: [32, 64], description: 可选：内核网卡计数器位数；32 位时面板按回绕补算流量（设计 5.5） }
            remote_upgrade: { type: boolean, description: 可选：本机是否启用了远程升级（设计 29.13）；省略表示旧版 Agent、未知 }
        cpu:
          type: object
          required: [usage, cores, load1]
          properties:
            usage: { type: number }
            cores: { type: integer }
            load1: { type: number }
            load5: { type: number }
            load15: { type: number }
            breakdown:
              type: object
              description: 可选：两次采样之间各类时间占比 0～100（设计 4.4）
              required: [user, nice, system, iowait, irq, softirq, steal, idle]
              properties:
                user: { type: number }
                nice: { type: number }
                system: { type: number }
                iowait: { type: number }
                irq: { type: number }
                softirq: { type: number }
                steal: { type: number }
                idle: { type: number }
            per_core: { type: array, items: { type: number }, description: 可选；GET /servers 列表中省略 }
            temp_c: { type: number, description: 可选，CPU 温度 ℃ }
        memory:
          type: object
          required: [total, used, usage]
          properties:
            total: { type: integer }
            used: { type: integer, description: MemTotal − MemAvailable }
            available: { type: integer }
            usage: { type: number }
            free: { type: integer, description: 可选 }
            buffers: { type: integer, description: 可选 }
            cached: { type: integer, description: 可选：Cached + SReclaimable }
        swap:
          type: object
          required: [total, used]
          properties:
            total: { type: integer }
            used: { type: integer }
        processes:
          type: object
          description: 可选（设计 4.9）
          required: [total, running]
          properties:
            total: { type: integer }
            running: { type: integer }
        conns:
          type: object
          description: 可选（设计 4.9）：sockstat 的 inuse，IPv4 + IPv6
          required: [tcp, udp, time_wait]
          properties:
            tcp: { type: integer }
            udp: { type: integer }
            time_wait: { type: integer }
        ports:
          type: array
          maxItems: 64
          description: 可选（设计 4.9.1）：本机监听端口，按协议与端口合并；不含连接明细与进程信息。节点列表接口省略此字段
          items:
            type: object
            required: [proto, port, addrs]
            properties:
              proto: { type: string, enum: [tcp, udp] }
              port: { type: integer }
              addrs: { type: array, items: { type: string }, description: '监听地址，如 0.0.0.0、::、127.0.0.1' }
        containers:
          type: array
          maxItems: 50
          description: |
            可选（设计 33.4，修订第 164 条）：运行中的 Docker / Podman 容器，从 cgroup 读取，按 CPU、内存从高到低，最多 50 个。
            不连接 Docker 套接字，因此没有容器名（见节点的 container_names）、已停止的容器与重启次数。节点列表接口省略此字段
          items:
            type: object
            required: [id, runtime, memory]
            properties:
              id: { type: string, description: 容器 ID 前 12 位 }
              runtime: { type: string, enum: [docker, podman] }
              cpu: { type: number, description: 占整机 CPU 的百分比；首次采样省略 }
              memory: { type: integer, description: 内存用量（字节），不含可回收的非活跃文件页 }
              mem_limit: { type: integer, description: 内存上限（字节）；省略或 0 表示不限 }
              pids: { type: integer }
              command: { type: string, description: '容器主进程的进程名（如 nginx），容器重建后不变，可作默认标识；只有进程名、没有命令行。读不到时省略（修订第 165 条）' }
              restarts: { type: integer, description: 'Agent 启动以来检测到的重启次数（CPU 累计时间归零，或消失后以同一 ID 再出现）；0 时省略（修订第 167 条）' }
        firewall:
          type: object
          description: |
            可选（修订第 168 条）：防火墙概况——Agent 不以 root 运行，读不到实时规则；规则来自可读的配置文件，不可读时 rules_readable 为 false。
            只在管理员的节点详情中返回（查看者、只读 API Key、App 与节点列表都省略）
          required: [tools]
          properties:
            tools:
              type: array
              description: 检测到的防火墙；空数组表示没有检测到
              items:
                type: object
                required: [name, active, rules_readable]
                properties:
                  name: { type: string, enum: [ufw, firewalld, nftables, iptables, fail2ban, csf] }
                  active: { type: boolean, description: 正在运行或已启用 }
                  policy: { type: string, enum: [allow, deny], description: 入站默认策略；不知道时省略 }
                  rules_readable: { type: boolean, description: 规则配置可读；false 时需要 root 才能查看 }
                  source: { type: string, description: 规则来源（配置文件） }
                  rules:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [action]
                      properties:
                        action: { type: string, enum: [allow, deny, reject, limit, ban] }
                        proto: { type: string }
                        port: { type: string, description: '22、8000:9000；省略表示全部端口' }
                        from: { type: string, description: 来源地址；省略表示任意 }
                        service: { type: string, description: 服务名（firewalld 服务、fail2ban jail） }
        proxies:
          type: array
          description: |
            可选（修订第 169 条）：代理程序——按进程名识别，协议与端口来自可读的配置文件，不含任何密钥。
            只在管理员的节点详情中返回（查看者、只读 API Key、App 与节点列表都省略）
          items:
            type: object
            required: [name, running]
            properties:
              name: { type: string, description: 'xray、v2ray、sing-box、hysteria、trojan、trojan-go、shadowsocks、tuic、gost、brook、frps、openvpn、wireguard、x-ui' }
              running: { type: boolean, description: 有进程在运行（WireGuard 为接口存在）；false 表示只找到了配置 }
              procs: { type: integer }
              config: { type: string, description: 读取的配置文件 }
              config_no: { type: string, enum: [unreadable, invalid], description: 'unreadable：配置只有 root 可读；invalid：格式无法识别' }
              inbounds:
                type: array
                maxItems: 30
                items:
                  type: object
                  required: [protocol, port, listening]
                  properties:
                    protocol: { type: string, description: 'vless、vmess、trojan、shadowsocks、hysteria2、tuic、socks、http、wireguard、openvpn 等' }
                    port: { type: integer }
                    network: { type: string, enum: [tcp, udp] }
                    transport: { type: string, description: 'ws、grpc、h2、httpupgrade、xhttp、kcp、quic 等' }
                    security: { type: string, description: 'tls、reality、none' }
                    local: { type: boolean, description: 只监听回环地址 }
                    listening: { type: boolean, description: 本机正在监听该端口 }
        watch_procs:
          type: array
          maxItems: 20
          description: 可选（设计 33.5.1）：节点关注的进程各有几个在运行；没有关注进程或旧版 Agent 时省略。只有名称与数量，不含进程列表
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer, description: 0 表示没有在运行 }
        disk:
          type: array
          description: 每个挂载点（设计 4.6）；只采集本地块设备文件系统，同一设备只报一次
          items:
            type: object
            required: [mount, total, used, usage]
            properties:
              mount: { type: string }
              total: { type: integer }
              used: { type: integer }
              usage: { type: number, description: 与 df 的 Use% 一致 }
              fstype: { type: string }
              device: { type: string }
              available: { type: integer }
        network:
          type: array
          description: 每块网卡；rx/tx_bytes 为内核累计字节数，rx/tx_speed 为 Agent 计算的字节/秒
          items:
            type: object
            required: [interface, rx_bytes, tx_bytes, rx_speed, tx_speed]
            properties:
              interface: { type: string }
              ifindex: { type: integer }
              rx_bytes: { type: integer }
              tx_bytes: { type: integer }
              rx_speed: { type: integer }
              tx_speed: { type: integer }
              rx_pps: { type: number, description: 可选：包速率（设计 4.10） }
              tx_pps: { type: number }
              rx_errors: { type: integer, description: 可选：开机以来的错误、丢包累计 }
              tx_errors: { type: integer }
              rx_dropped: { type: integer }
              tx_dropped: { type: integer }
        disk_io:
          type: array
          description: 可选，整块磁盘的 IO（设计 4.7）
          items:
            type: object
            required: [device, read_speed, write_speed]
            properties:
              device: { type: string }
              read_bytes: { type: integer }
              write_bytes: { type: integer }
              read_ops: { type: integer }
              write_ops: { type: integer }
              io_time_ms: { type: integer }
              read_speed: { type: integer }
              write_speed: { type: integer }
              read_iops: { type: number, description: 可选 }
              write_iops: { type: number, description: 可选 }
              await_ms: { type: number, description: 可选：每次 IO 平均耗时 }
              util: { type: number, description: 可选：设备忙碌占比 0～100 }
              in_flight: { type: integer, description: 可选：采样时正在处理的 IO 请求数（设计 4.10） }
        collect_errors:
          type: array
          description: 可选：本轮失败的采集项及原因，对应字段留空，其余照常（设计 43.5）
          items:
            type: object
            required: [item, message]
            properties:
              item: { type: string, enum: [system, cpu, memory, disk, disk_io, network, processes, conns, ports, containers, firewall, proxies, extra] }
              message: { type: string }
        extra:
          type: object
          description: >-
            可选：扩展指标（设计 4.10），字段定义见 internal/protocol.Extra。面板保存在实时状态中随接口返回，暂不入库也不展示。
            读不到或内核不提供的项省略；速率为与上一次采样之间的平均值。
          properties:
            activity: { type: object, description: /proc/stat：ctx_switches、interrupts、forks（每秒）、procs_blocked }
            vm: { type: object, description: /proc/vmstat：major_faults（每秒）、swap_in / swap_out（字节/秒）、oom_kills（开机以来，内核 4.13+） }
            pressure: { type: object, description: PSI（内核 4.20+）：cpu_some_avg10/60、memory_some_avg10、memory_full_avg10、io_some_avg10、io_full_avg10 }
            memory_more: { type: object, description: /proc/meminfo：shmem、slab_unreclaim、dirty、writeback、committed、commit_limit（字节） }
            net: { type: object, description: /proc/net/snmp：tcp_established、tcp_retrans_rate（%）、tcp_active_opens / tcp_passive_opens（每秒）、错误累计 }
            file_handles: { type: object, description: /proc/sys/fs/file-nr：allocated、max }
            conntrack: { type: object, description: nf_conntrack：count、max；未加载时省略 }
            clock: { type: object, description: adjtimex：synced、max_error_us }
            env:
              type: object
              description: 运行环境（设计 46.3）
              properties:
                virt: { type: string, description: 'kvm / xen / vmware / hyperv / virtualbox / openvz / lxc / docker / podman / wsl / vm / none；无法判断时省略' }
                dmi_vendor: { type: string, description: /sys/class/dmi/id/sys_vendor，如 QEMU、Alibaba Cloud }
                dmi_product: { type: string }

    CloudAccountInput:
      type: object
      description: 添加时 provider、name、credential 必填；修改时 provider 不可更改，credential 留空表示不变
      required: [name]
      properties:
        provider: { type: string, enum: [aws, aliyun_cn, aliyun_intl, tencent_cn, tencent_intl, oci], description: 'aliyun_cn / aliyun_intl：阿里云国内站（aliyun.com）/ 国际站（alibabacloud.com）；tencent_cn / tencent_intl：腾讯云国内站（cloud.tencent.com）/ 国际站（tencentcloud.com）；oci：Oracle Cloud' }
        name: { type: string, maxLength: 64 }
        regions: { type: array, items: { type: string }, maxItems: 40, description: 只同步这些区域；空表示全部已启用的区域 }
        credential:
          type: object
          description: 只读凭证（设计 44.3 列出最小权限）。只写不读：响应中只有 credential_hint
          properties:
            access_key_id: { type: string, description: 'AWS：IAM 用户的 Access Key ID（AKIA…）；阿里云：RAM 用户的 AccessKey ID（LTAI…）' }
            secret_access_key: { type: string, description: AWS }
            access_key_secret: { type: string, description: 阿里云 }
            secret_id: { type: string, description: 腾讯云 CAM 子用户的 SecretId（AKID…） }
            secret_key: { type: string, description: 腾讯云 }
            tenancy_ocid: { type: string, description: 'Oracle Cloud：租户 OCID（ocid1.tenancy.…）' }
            user_ocid: { type: string, description: 'Oracle Cloud：用户 OCID（ocid1.user.…）' }
            fingerprint: { type: string, description: Oracle Cloud：API 签名密钥的指纹 }
            private_key: { type: string, description: Oracle Cloud：API 签名私钥（PEM，不带密码） }
            region: { type: string, description: Oracle Cloud：主区域（home region），如 ap-tokyo-1 }
        budget: { type: number, minimum: 0, description: 月度预算（账户币种：AWS 为 USD，阿里云国内站 CNY、国际站多为 USD）；0 表示不设 }
        balance_alert: { type: number, minimum: 0, description: 余额低于此金额时提醒（账户币种；只对返回余额的阿里云、腾讯云有效，设计 44.6）；0 表示不提醒 }
        cost_interval_h: { type: integer, enum: [6, 12, 24], description: 费用同步间隔，小时；AWS 每次同步约 0.02 美元 }
        enabled: { type: boolean }
        sync_cost: { type: boolean }
        sync_traffic: { type: boolean }

    CloudCheckItem:
      type: object
      description: 权限检查的一项（修订第 204 条）
      required: [name, policy, ok, detail]
      properties:
        name: { type: string, description: 检查项，如 “ECS 实例” }
        policy: { type: string, description: 所需的系统只读策略，如 AliyunECSReadOnlyAccess }
        ok: { type: boolean }
        detail: { type: string, description: 成功时为结果摘要（如各区域的实例数），失败时为服务商返回的错误 }
    CloudAccount:
      type: object
      required: [id, provider, name, regions, credential_hint, budget_cents, balance_alert_cents, cost_interval_h, enabled, sync_cost, sync_traffic,
                 cost_synced_at, instances_synced_at, traffic_synced_at, last_error, last_warning, instances_recheck_at, error_since, auth_failed, next_try_at,
                 instance_count, current_cost, traffic_pools, pool_warning, cost_warning, created_at, updated_at]
      properties:
        id: { type: integer }
        provider: { type: string, enum: [aws, aliyun_cn, aliyun_intl, tencent_cn, tencent_intl, oci] }
        name: { type: string }
        regions: { type: array, items: { type: string } }
        credential_hint: { type: string, description: '如 AKIA…WXYZ；完整凭证不返回' }
        budget_cents: { type: integer }
        balance_alert_cents: { type: integer, description: 余额提醒阈值（分）；0 表示不提醒 }
        cost_interval_h: { type: integer }
        enabled: { type: boolean }
        sync_cost: { type: boolean }
        sync_traffic: { type: boolean }
        cost_synced_at: { type: integer, description: 上次成功同步费用的时间，Unix 秒；0 表示从未 }
        instances_synced_at: { type: integer }
        traffic_synced_at: { type: integer }
        last_error: { type: string, description: 最近一次同步失败的原因（云厂商的错误码与说明）；空表示正常 }
        error_since: { type: integer, description: 连续失败的开始时间，Unix 秒；0 表示正常 }
        auth_failed: { type: boolean, description: 凭证失效或权限不足（账户级调用失败，或某类接口在所有区域都被拒绝），已停止自动同步，需更新凭证 }
        last_warning: { type: string, description: '最近一次同步跳过的区域及原因（修订第 141 条），如“区域 ap-east-1 的 Lightsail 不可用（可能未开通该区域），已跳过：…”、“区域 eu-west-3 的 Lightsail 正在为账户初始化，本轮跳过，下一轮再试”；被跳过区域的实例保留上一次的结果。空表示没有' }
        instances_recheck_at: { type: integer, description: '有区域暂时失败（初始化中、服务端错误、限流、网络）时提前重新检查实例的时间，约 30 分钟后（修订第 151 条）；0 表示按常规每 6 小时' }
        next_try_at: { type: integer, description: 失败后下次自动重试的时间 }
        syncing: { type: boolean, description: 正在同步 }
        instance_count: { type: integer }
        current_cost:
          oneOf: [{ $ref: '#/components/schemas/CloudCost' }, { type: 'null' }]
          description: 本月费用；尚未同步时为 null
        traffic_pools:
          type: array
          items: { $ref: '#/components/schemas/CloudTrafficPool' }
          description: 账户级流量池（修订第 181 条）：阿里云 CDT 公网流量免费额度，本月有 CDT 流量时才有；只返回本月的
        pool_warning: { type: string, description: 最近一次读取流量池失败的原因（如缺少 CDT 只读权限）；空表示正常 }
        cost_warning: { type: string, description: '费用因子用户没有费用 / 账单只读权限而未读取时的提示（修订第 184 条）；空表示正常。权限不足不会停止整个账户的同步' }
        created_at: { type: integer }
        updated_at: { type: integer }

    CloudTrafficPool:
      type: object
      required: [key, name, used_bytes, limit_bytes, period_start, updated_at]
      properties:
        key: { type: string, enum: [cdt_cn, cdt_intl], description: 'cdt_cn：中国内地（20 GB / 月）；cdt_intl：非中国内地（含中国香港，200 GB / 月）' }
        name: { type: string, description: 显示名称 }
        used_bytes: { type: integer, description: 本月已用（只计按流量计费的 BGP 多线流量；精品线路不享受免费额度，不计入） }
        limit_bytes: { type: integer, description: 免费额度（1024 进制） }
        period_start: { type: string, description: 'YYYY-MM-DD，自然月（北京时间）第一天' }
        updated_at: { type: integer }

    CloudCost:
      type: object
      required: [period, amount_cents, forecast_cents, balance_cents, currency, updated_at]
      properties:
        period: { type: string, description: YYYY-MM }
        amount_cents: { type: integer, description: 本月已产生 }
        forecast_cents: { type: [integer, 'null'], description: 本月预估；数据不足时为 null }
        balance_cents: { type: [integer, 'null'], description: 账户余额（预付费账户）；没有时为 null }
        currency: { type: string }
        updated_at: { type: integer }

    CloudInstance:
      type: object
      required: [id, account_id, account_name, provider, instance_id, name, region, kind, state, state_norm, state_at, public_ipv4, public_ipv6, plan,
                 expire_at, renew_price_cents, traffic_limit_bytes, traffic_used_bytes, traffic_period_start, server_id, updated_at,
                 suggested_server_id, auto_calibrate, calibrated_at, calibrate_status, cdt_pool]
      properties:
        id: { type: integer }
        account_id: { type: integer }
        account_name: { type: string }
        provider: { type: string }
        instance_id: { type: string }
        name: { type: string }
        region: { type: string }
        kind: { type: string, description: ec2 / lightsail / ecs / swas（阿里云轻量）/ cvm / lighthouse（腾讯云轻量）/ oci / oci_egress（Oracle 租户每月出站流量） }
        state: { type: string, description: 云厂商原样，如 running / stopped }
        state_norm: { type: string, enum: [running, stopped, starting, stopping, pending, rebooting, expired, frozen, deleting, error, unknown], description: '修订第 232 条：由 state 归一化的状态（面板统一计算，Web 与 App 按它显示中文）；state 保留原样供排错' }
        state_at: { type: integer, description: '状态的同步时间（账户最近一次成功同步实例列表，Unix 秒；0 为尚未同步）。超过 12 小时（两个同步周期）视为状态可能已过期' }
        public_ipv4: { type: string }
        public_ipv6: { type: string }
        plan: { type: string, description: 规格（EC2 实例类型、Lightsail 套餐） }
        expire_at: { type: integer, description: 到期时间，Unix 秒；按需付费为 0 }
        renew_price_cents: { type: integer }
        traffic_limit_bytes: { type: integer, description: 流量包额度，字节；0 表示没有流量包 }
        traffic_used_bytes: { type: integer, description: 本周期已用（云厂商口径，有数小时延迟） }
        traffic_period_start: { type: string, description: YYYY-MM-DD }
        cdt_pool: { type: string, enum: ['', cdt_cn, cdt_intl], description: '阿里云 ECS 公网按流量计费（含按流量计费的 EIP）时走 CDT，为所属的免费额度池（账号内共用，用量见账户的 traffic_pools）；空表示不走 CDT（修订第 186 条）' }
        server_id: { type: [integer, 'null'], description: 关联的节点（设计 44.5） }
        suggested_server_id: { type: [integer, 'null'], description: 未关联时，公网 IP 与之唯一匹配的节点（建议关联，需用户确认） }
        updated_at: { type: integer }
        auto_calibrate: { type: boolean, description: 每天用云厂商口径的本周期流量自动校准关联节点（设计 44.5） }
        calibrated_at: { type: integer, description: 上次自动校准（或检查）的时间；0 表示还没有执行 }
        calibrate_status: { type: string, description: '上次自动校准的结果，如“已按云厂商数值校准为 120 GB”或未校准的原因' }

    APIKeyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        scope_type: { type: string, enum: [all, group, servers], default: all }
        group: { type: string, description: scope_type 为 group 时的分组名 }
        server_ids: { type: array, items: { type: integer }, maxItems: 1000, description: scope_type 为 servers 时的节点 }
        expires_in_days: { type: integer, minimum: 0, maximum: 3650, description: 0 表示不过期 }

    APIKey:
      type: object
      required: [id, name, hint, scope_type, scope_value, expires_at, created_by, created_at, last_used_at, revoked_at]
      properties:
        id: { type: integer }
        name: { type: string }
        hint: { type: string, description: Key 的末 4 位 }
        scope_type: { type: string, enum: [all, group, servers] }
        scope_value: { type: string, description: 分组名，或逗号分隔的节点 ID }
        expires_at: { type: integer, description: 过期时间，Unix 秒；0 表示不过期 }
        created_by: { type: string }
        created_at: { type: integer }
        last_used_at: { type: integer, description: 最近使用时间（每分钟最多更新一次）；0 表示从未使用 }
        revoked_at: { type: integer, description: 吊销时间；0 表示有效 }

    AppAccessKeyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        scope_type: { type: string, enum: [all, group, servers], description: 默认 all }
        group: { type: string, description: scope_type=group 时的分组名 }
        server_ids: { type: array, items: { type: integer }, description: scope_type=servers 时的节点 }
        allow_low_risk_ops: { type: boolean, description: 允许静音与维护，默认 true }
        allow_subscriptions: { type: boolean, description: '允许配对的设备新增、修改、删除订阅（修订第 217、218 条，约束 5 的唯一写入例外）；只对“全部节点”授权生效，默认 false' }
        max_devices: { type: integer, minimum: 1, maximum: 10, description: 最多配对几台设备，默认 1 }
        expires_in_days: { type: integer, minimum: 1, maximum: 90, description: AK 的配对有效期，默认 1 天 }

    AppAccessKey:
      type: object
      required: [id, name, hint, scope_type, scope_value, allow_low_risk_ops, allow_subscriptions, max_devices, paired_devices, expires_at, status, created_by, created_at, last_used_at, revoked_at]
      properties:
        id: { type: integer }
        name: { type: string }
        hint: { type: string, description: '脱敏显示，如 MNT-X7K9-****-W8QF' }
        scope_type: { type: string, enum: [all, group, servers] }
        scope_value: { type: string, description: 分组名，或逗号分隔的节点 ID }
        allow_low_risk_ops: { type: boolean }
        allow_subscriptions: { type: boolean }
        max_devices: { type: integer }
        paired_devices: { type: integer }
        expires_at: { type: integer }
        status: { type: string, enum: [active, used, expired, revoked] }
        created_by: { type: string }
        created_at: { type: integer }
        last_used_at: { type: integer, description: 最近一次配对；0 表示从未使用 }
        revoked_at: { type: integer }

    AppDevice:
      type: object
      required: [id, access_key_id, access_key_name, name, platform, app_version, scope_type, scope_value, allow_low_risk_ops, allow_subscriptions, status, paired_at, last_seen_at, revoked_at, revoked_by]
      properties:
        id: { type: integer }
        access_key_id: { type: integer }
        access_key_name: { type: string }
        name: { type: string }
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string }
        scope_type: { type: string, enum: [all, group, servers] }
        scope_value: { type: string }
        allow_low_risk_ops: { type: boolean }
        allow_subscriptions: { type: boolean }
        status: { type: string, enum: [active, expired, revoked] }
        paired_at: { type: integer }
        last_seen_at: { type: integer, description: 最近一次请求（每分钟最多更新一次） }
        revoked_at: { type: integer }
        revoked_by: { type: string, description: 'admin / app（本机解除）/ access_key（随 AK 吊销）/ refresh_reuse（Refresh Token 重复使用）' }

    AppTokens:
      type: object
      required: [device_id, access_token, refresh_token, expires_in, refresh_expires_in, scope]
      properties:
        device_id: { type: integer }
        access_token: { type: string, description: 'dev_…，放在 Authorization: Bearer 中' }
        refresh_token: { type: string, description: 'rt_…，只用于 /app/token/refresh' }
        expires_in: { type: integer, description: Access Token 剩余秒数 }
        refresh_expires_in: { type: integer, description: Refresh Token 剩余秒数 }
        scope: { $ref: '#/components/schemas/AppScope' }

    AppScope:
      type: object
      required: [type, value, allow_low_risk_ops, allow_subscriptions]
      properties:
        type: { type: string, enum: [all, group, servers] }
        value: { type: string }
        allow_low_risk_ops: { type: boolean }
        allow_subscriptions: { type: boolean, description: 可以新增订阅（AK 允许记录订阅且授权全部节点） }

    FxRates:
      type: object
      required: [base, source, as_of, fetched_at, rates, error]
      properties:
        base: { type: string, enum: [CNY] }
        source: { type: string, description: 汇率来源说明 }
        as_of: { type: integer, description: 来源数据的时间（Unix 秒）；0 表示还没有取到 }
        fetched_at: { type: integer, description: 面板最近一次成功取得的时间（Unix 秒） }
        rates: { type: object, additionalProperties: { type: number }, description: 币种 → 1 单位折合多少人民币；总含 CNY = 1 }
        error: { type: string, description: 最近一次请求失败的原因；成功后为空 }
    AppSubscriptions:
      type: object
      required: [limited, items]
      properties:
        limited: { type: boolean, description: 授权范围不是“全部节点”：不返回订阅 }
        items: { type: array, items: { $ref: '#/components/schemas/Subscription' } }
    AppCloud:
      type: object
      required: [limited, accounts, instances]
      properties:
        limited: { type: boolean, description: 设备的授权范围不是“全部节点”，不返回云账户 }
        accounts:
          type: array
          items:
            type: object
            required: [id, provider, name, enabled, syncing, auth_failed, last_error, last_warning, next_try_at, synced_at, instance_count, budget_cents, current_cost]
            properties:
              id: { type: integer }
              provider: { type: string, description: 'aws / aliyun_cn / aliyun_intl / tencent_cn / tencent_intl / oci' }
              name: { type: string }
              enabled: { type: boolean }
              syncing: { type: boolean }
              auth_failed: { type: boolean, description: 凭证失效或权限不足，已停止自动同步 }
              last_error: { type: string }
              last_warning: { type: string, description: 最近一次同步跳过的区域及原因（修订第 141 条） }
              next_try_at: { type: integer, description: 同步失败后的下次重试时间 }
              synced_at: { type: integer, description: 费用、实例、流量中最近一次成功同步的时间；0 为尚未同步 }
              instance_count: { type: integer }
              budget_cents: { type: integer, description: 每月预算（分）；0 为未设置 }
              current_cost:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [period, amount_cents, forecast_cents, balance_cents, currency]
                    properties:
                      period: { type: string, description: YYYY-MM }
                      amount_cents: { type: integer }
                      forecast_cents: { type: ['integer', 'null'] }
                      balance_cents: { type: ['integer', 'null'] }
                      currency: { type: string }
        instances:
          type: array
          items:
            type: object
            required: [id, account_id, name, region, kind, state, state_norm, state_at, plan, expire_at, traffic_used_bytes, traffic_limit_bytes, server_id]
            properties:
              id: { type: integer }
              account_id: { type: integer }
              name: { type: string }
              region: { type: string }
              kind: { type: string, description: 'ec2 / lightsail / ecs / swas / cvm / lighthouse / oci 等' }
              state: { type: string }
              state_norm: { type: string, enum: [running, stopped, starting, stopping, pending, rebooting, expired, frozen, deleting, error, unknown], description: '修订第 232 条：由 state 归一化的状态（面板统一计算，Web 与 App 按它显示中文）；state 保留原样供排错' }
              state_at: { type: integer, description: '状态的同步时间（账户最近一次成功同步实例列表，Unix 秒；0 为尚未同步）。超过 12 小时（两个同步周期）视为状态可能已过期' }
              plan: { type: string }
              expire_at: { type: integer, description: 到期时间；0 为按量或没有到期 }
              traffic_used_bytes: { type: integer }
              traffic_limit_bytes: { type: integer, description: 0 为没有流量包 }
              server_id: { type: ['integer', 'null'], description: 关联的节点 }

    AppMe:
      type: object
      required: [device_id, name, platform, scope, panel_version, push_available, push_enabled, center_id]
      properties:
        device_id: { type: integer }
        name: { type: string }
        platform: { type: string }
        scope: { $ref: '#/components/schemas/AppScope' }
        panel_version: { type: string }
        push_available: { type: boolean, description: 面板已配置 Push Relay（--push-relay），可以登记推送 }
        push_enabled: { type: boolean, description: 本机已登记推送 Token }
        center_id: { type: string, description: 本面板的匿名标识（推送 payload 的 center_id，多监控中心时区分来源，设计 30.3.2）；未启用推送时为空 }

    WsEvent:
      type: object
      description: WebSocket 推送的事件（设计 20、45.2）；未来新增类型，页面应忽略不认识的 type。API Key 只收到其范围内节点的事件
      required: [type, ts]
      properties:
        type:
          type: string
          enum: [server.enrolled, server.metrics, server.online, server.offline, alert.triggered, alert.recovered]
          description: |
            server.enrolled：主机已用注册码注册（只发给 Web 管理员）；server.metrics：收到一份上报，data 为 ServerView（同节点列表的一项）；
            server.online / server.offline：上下线（每 10 秒检查一次）；alert.triggered / alert.recovered：告警触发 / 恢复
        server_id: { type: integer }
        ts: { type: integer, description: 事件时间，Unix 秒 }
        data:
          oneOf:
            - { $ref: '#/components/schemas/ServerView' }
            - { $ref: '#/components/schemas/WsEventInfo' }

    WsEventInfo:
      type: object
      description: 除 server.metrics 以外的事件数据；不含任何凭证
      properties:
        server_name: { type: string }
        warnings: { type: array, items: { type: string }, description: server.enrolled：主机名 / IP 与填写值不一致的提示 }
        event_id: { type: integer, description: 告警事件 }
        rule_key: { type: string }
        type: { type: string, description: 告警类型 }
        severity: { type: string, enum: [info, warning, critical] }
        value: { type: number }
        message: { type: string }

    MetricPoint:
      type: object
      required: [ts, cpu, cpu_max, load1, mem_used, mem_total, swap_used, disk_used, disk_total, rx_speed, rx_speed_max, tx_speed, tx_speed_max, disk_read, disk_read_max, disk_write, disk_write_max, steal, steal_max, iowait, iowait_max, tcp, tcp_max]
      properties:
        ts: { type: integer, description: 桶起点，Unix 秒 }
        cpu: { type: number }
        cpu_max: { type: number }
        load1: { type: number }
        mem_used: { type: integer }
        mem_total: { type: integer }
        swap_used: { type: integer }
        disk_used: { type: integer }
        disk_total: { type: integer }
        rx_speed: { type: integer }
        rx_speed_max: { type: integer }
        tx_speed: { type: integer }
        tx_speed_max: { type: integer }
        disk_read: { type: ['integer', 'null'], description: 所有磁盘读速率之和，字节/秒；旧版 Agent 时段为 null（设计 4.7） }
        disk_read_max: { type: ['integer', 'null'] }
        disk_write: { type: ['integer', 'null'] }
        disk_write_max: { type: ['integer', 'null'] }
        steal: { type: ['number', 'null'], description: CPU steal 占比 0～100；旧版 Agent 时段为 null（设计 4.4） }
        steal_max: { type: ['number', 'null'] }
        iowait: { type: ['number', 'null'], description: CPU iowait 占比 0～100；旧版 Agent 时段为 null（设计 4.4） }
        iowait_max: { type: ['number', 'null'] }
        tcp: { type: ['integer', 'null'], description: TCP 连接数（不含 TIME_WAIT）；旧版 Agent 时段为 null（设计 4.9） }
        tcp_max: { type: ['integer', 'null'] }
