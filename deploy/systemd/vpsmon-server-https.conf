# Drop-in for built-in HTTPS (design 25): the panel obtains certificates via ACME itself.
#   sudo mkdir -p /etc/systemd/system/vpsmon-server.service.d
#   sudo cp vpsmon-server-https.conf /etc/systemd/system/vpsmon-server.service.d/https.conf
#   (edit the domain, then) sudo systemctl daemon-reload && sudo systemctl restart vpsmon-server
# Ports 80 and 443 must be reachable from the internet; using --domain implies accepting the CA's terms.
[Service]
ExecStart=
ExecStart=/usr/local/bin/vpsmon-server run --data /var/lib/vpsmon --domain monitor.example.com
# Still non-root: only the capability to bind ports below 1024
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
